# One rule and no other: a test waits on a signal, never on the clock,
# see CLAUDE.md. forbidigo refuses the clock in test files only. make lint
# runs it with --new-from-rev, so a wait from before #445 passes until #394
# takes it out, and a new or changed line fails. time.Second and the other
# durations are allowed, and so is a fake clock a test drives. A line in a
# testing/synctest bubble, whose clock is fake, says
# //nolint:forbidigo // synctest bubble.
version: "2"
linters:
  default: none
  enable: [forbidigo]
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.(Sleep|After|Tick|NewTimer|NewTicker|AfterFunc)$
          pkg: ^time$
          msg: a test waits on a signal, never on the clock, see CLAUDE.md
  exclusions:
    rules:
      - path-except: _test\.go$
        linters: [forbidigo]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
