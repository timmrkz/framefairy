# Three rules and no other. A test waits on a signal, never on the clock,
# see CLAUDE.md. forbidigo refuses the clock in test files only, over the
# whole tree: a sleep, a timer or a ticker, and a context with a deadline,
# which is a timer by another name, and a check on how long something
# took, time.Since or time.Until, because work is counted in steps, not
# in milliseconds. time.Second and the other durations
# are allowed, and so is a fake clock a test drives. A line in a
# testing/synctest bubble, whose clock is fake, says
# //nolint:forbidigo // synctest bubble. A line that keeps the real clock
# on purpose says why on the line, and names its issue when it has one.
#
# And no code of ours hears keys pressed in other apps or reads what was
# copied in them, through Wails' global shortcuts or its clipboard,
# however the call is reached, issue #369. Putting something on the
# clipboard is no read. See What is never signed in docs/UPDATES.md.
#
# And no code of ours writes to the standard library's log, outside the
# tests: the app logs through theLog and everything else through the
# engine's Log, the ones that reach the log a report sends, issue #605.
version: "2"
linters:
  default: none
  enable: [forbidigo]
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.(Sleep|After|Tick|NewTimer|NewTicker|AfterFunc)$
          pkg: ^time$
          msg: a test waits on a signal, never on the clock, see CLAUDE.md
        - pattern: ^context\.(WithTimeout|WithDeadline|WithTimeoutCause|WithDeadlineCause)$
          pkg: ^context$
          msg: a test waits on a signal, never on the clock, and a deadline is a clock, see CLAUDE.md
        - pattern: ^time\.(Since|Until)$
          pkg: ^time$
          msg: a test counts steps, not milliseconds, see CLAUDE.md
        - pattern: ^application\.(GlobalShortcutManager\.Register|ClipboardManager\.Text)$
          pkg: ^github\.com/wailsapp/wails/v3/pkg/application$
          msg: the app hears no keys pressed in other apps and reads no clipboard, see What is never signed in docs/UPDATES.md
        - pattern: ^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$
          pkg: ^log$
          msg: "our code logs through theLog in the app and through the engine's Log everywhere else, which reach the log a report sends, issue #605"
  exclusions:
    rules:
      - path-except: _test\.go$
        linters: [forbidigo]
        text: see CLAUDE\.md
      - path: _test\.go$
        linters: [forbidigo]
        text: "issue #605"
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
