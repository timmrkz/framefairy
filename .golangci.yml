# golangci-lint holds one rule here and nothing else: a test waits on a
# signal, never on the clock, see CLAUDE.md. Only forbidigo is on, and
# only for test files, so the linter says nothing about the rest of the
# code. make lint runs it, at the version scripts/golangci-lint.sh pins.
version: "2"

run:
  # The test files are what it is about. Those behind a build tag the
  # machine does not have are not read: internal/outside is for a Mac with
  # the tag outside, and CI lints on Linux.
  tests: true

linters:
  default: none
  enable:
    - forbidigo
  settings:
    forbidigo:
      # By type, so time reached under another name is still time. A
      # test in a testing/synctest bubble has a clock it controls, and its
      # line says so with //nolint:forbidigo and the reason.
      analyze-types: true
      forbid:
        - pattern: ^time\.(Sleep|After|Tick|NewTimer|NewTicker|AfterFunc)$
          pkg: ^time$
          msg: a test waits on a signal, never on the clock, see CLAUDE.md
  exclusions:
    # A line below that no longer matches anything is said, so the list
    # can be shortened.
    warn-unused: true
    rules:
      # Code that is not a test may keep time. The rule is about tests.
      - path-except: _test\.go$
        linters: [forbidigo]
      # What waited on the clock before the rule was enforced, line by
      # line, so only a new one fails. Taking them out is #394. A line here
      # covers the same line anywhere in its file, and a line that is
      # changed is new.
      - path: '^cmd/framefairy-app/applog_test\.go$'
        source: '^\s*time\.Sleep\(2 \* slowEditAfter\)$'
        linters: [forbidigo]
      - path: '^cmd/framefairy-app/bridge_test\.go$'
        source: '^\s*time\.Sleep\(wait\)$'
        linters: [forbidigo]
      - path: '^cmd/framefairy-app/bridge_test\.go$'
        source: '^\s*time\.Sleep\(time\.Duration\(p\.pace\.Load\(\)\) \* time\.Millisecond\)$'
        linters: [forbidigo]
      - path: '^cmd/framefairy-app/bugs_test\.go$'
        source: '^\s*time\.Sleep\(20 \* time\.Millisecond\)$'
        linters: [forbidigo]
      - path: '^cmd/framefairy-app/bugs_test\.go$'
        source: '^\s*case <-time\.After\(2 \* time\.Second\):$'
        linters: [forbidigo]
      - path: '^cmd/framefairy-app/bugs_test\.go$'
        source: '^\s*time\.Sleep\(time\.Millisecond\)$'
        linters: [forbidigo]
      - path: '^cmd/framefairy-app/captions_test\.go$'
        source: '^\s*time\.Sleep\(100 \* time\.Microsecond\)$'
        linters: [forbidigo]
      - path: '^cmd/framefairy-app/captions_test\.go$'
        source: '^\s*time\.Sleep\(time\.Duration\(100\*\(i\+1\)\) \* time\.Microsecond\)$'
        linters: [forbidigo]
      - path: '^cmd/framefairy-app/chosen_test\.go$'
        source: '^\s*time\.Sleep\(5 \* time\.Millisecond\)$'
        linters: [forbidigo]
      - path: '^cmd/framefairy-app/driver_test\.go$'
        source: '^\s*time\.Sleep\(20 \* time\.Millisecond\)$'
        linters: [forbidigo]
      - path: '^cmd/framefairy-app/driver_test\.go$'
        source: '^\s*time\.Sleep\(40 \* time\.Millisecond\)$'
        linters: [forbidigo]
      - path: '^cmd/framefairy-app/driver_test\.go$'
        source: '^\s*case <-time\.After\(30 \* time\.Second\):$'
        linters: [forbidigo]
      - path: '^cmd/framefairy-app/frames_test\.go$'
        source: '^\s*time\.Sleep\(2 \* time\.Millisecond\)$'
        linters: [forbidigo]
      - path: '^cmd/framefairy-app/guard_test\.go$'
        source: '^\s*case <-time\.After\(100 \* time\.Millisecond\):$'
        linters: [forbidigo]
      - path: '^cmd/framefairy-app/handclip_test\.go$'
