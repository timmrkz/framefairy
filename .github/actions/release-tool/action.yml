# Puts framefairy-release on the path for a job that holds a key or a
# token that writes, without building it from a cache any run on main can
# write. See docs/decisions/2026-11-24-the-release-tool-built-once.md and
# docs/decisions/2026-11-25-the-release-tool-keys-itself.md.
#
# The tool is built by release-tool.yml on main, signed there with a build
# attestation, and kept as the asset framefairy-release of the release
# release-tool. It carries the key of what it was built from, which it
# works out itself from its imports, see cmd/framefairy-release/self.go,
# so nothing here names its folders. This action downloads it, checks
# that the attestation says main's release-tool.yml made it on GitHub's
# own runner, and asks it whether it is built from the checkout's code.
# Any branch can upload an asset, since a push runs the branch's own
# workflow file, but none can make an attestation that says main. An
# older build of main's carries its own older key, so it does not fit a
# newer checkout.
#
# With no such asset, one that fails the check, or one built from other
# code, right after a change to the tool, it builds the tool from the
# checkout with setup-go and no cache, stamped with its key, which takes
# about 12 s.
name: Release tool
description: framefairy-release on the path, as main built and signed it, or built here with no cache

outputs:
  built:
    description: true when no signed build of this code was there and the tool was built here.
    value: ${{ steps.fits.outputs.fits != 'true' }}

runs:
  using: composite
  steps:
    - id: download
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DIR: ${{ runner.temp }}/release-tool
      run: gh release download release-tool --repo "$GITHUB_REPOSITORY" --pattern framefairy-release --dir "$DIR" --clobber
    - id: verify
      if: steps.download.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TOOL: ${{ runner.temp }}/release-tool/framefairy-release
        SIGNER: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release-tool.yml@refs/heads/main
      run: gh attestation verify "$TOOL" --repo "$GITHUB_REPOSITORY" --cert-identity "$SIGNER" --source-ref refs/heads/main --deny-self-hosted-runners
    - id: fits
      if: steps.verify.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        TOOL: ${{ runner.temp }}/release-tool/framefairy-release
      run: chmod +x "$TOOL" && "$TOOL" fits
    - if: steps.fits.outputs.fits != 'true'
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
        cache: false
    - if: steps.fits.outputs.fits != 'true'
      shell: bash
      env:
        CGO_ENABLED: "0"
        TOOL: ${{ runner.temp }}/release-tool/framefairy-release
      run: go run -trimpath ./cmd/framefairy-release self -out "$TOOL"
