# Which jobs of .github/workflows/ci.yml a pull request starts, read by
# dorny/paths-filter in the job changes. A push to main starts every job
# whatever this says.
#
# Each filter but the last two is every file, '**', less the files that
# cannot change what its jobs do. So a file nobody thought of starts them
# all, which is what the Makefile, a workflow, a script and go.mod need:
# they decide how the project is built. The quantifier is
# some-with-excludes: a file counts when it matches '**' and no pattern
# after a '!'.
#
# scripts/ci-filters-test.sh checks it, and reads it line by line: a
# name and a colon, then one quoted pattern to a line.

# The jobs build, walks and outside: the app as a whole. Never a reason
# to start a job, in every filter below: the docs, and the rules that no
# job runs but their own check, which the job build runs whatever
# changed. So does the Go test that reads the docs, the scripts and the
# interface whole for the endings of a video.
app:
  - '**'
  - '!docs/**'
  - '!**/*.md'
  - '!LICENSE'
  - '!.vscode/**'
  - '!.claude/**'
  - '!scripts/{main-moved,needs-build,plan-frozen,changed}{,-test}.sh'

# The jobs linux, fuzz and macos: the Go tests. No Go test builds the
# interface, so only the files of it a Go test reads count, like api.ts,
# and the one that reads all of it runs in the job build. These jobs run
# scripts/changed.sh on a pull request, so a change to it starts them.
# They do not run in the CI image, which only the walks do, so a change
# to it does not start them.
go:
  - '**'
  - '!docs/**'
  - '!**/*.md'
  - '!LICENSE'
  - '!.vscode/**'
  - '!.claude/**'
  - '!scripts/{main-moved,needs-build,plan-frozen}{,-test}.sh'
  - '!scripts/changed-test.sh'
  - '!.github/ci-image/**'
  - '!frontend/**/!(api.ts|*.cases.json)'

# The job interface, which needs Node and nothing of Go, nor the CI image.
interface:
  - '**'
  - '!docs/**'
  - '!**/*.md'
  - '!LICENSE'
  - '!.vscode/**'
  - '!.claude/**'
  - '!scripts/{main-moved,needs-build,plan-frozen,changed}{,-test}.sh'
  - '!.github/ci-image/**'
  - '!**/*.go'
  - '!go.{mod,sum}'

# The check of the action pins, in the job build.
workflows:
  - '.github/workflows/**'

# The check of what make changed runs, in the job build, which also runs
# it whenever it builds.
changed:
  - 'scripts/changed{,-test}.sh'
