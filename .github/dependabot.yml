# Dependabot opens a pull request when a Go module, a package of the
# interface, an action or a Python package in requirements.txt has a newer
# version, once a week, and at once for a security fix when Dependabot
# security updates are on in the settings.
# See docs/BUILD.md, Keeping up.
#
# Left out, because each moves with something Dependabot cannot change:
# Wails, which is pinned exactly and moves together with @wailsio/runtime,
# and the speech library, whose native libraries scripts/speech-libs.sh
# pins by checksum beside the Go module's version. scripts/upstream.sh
# watches the speech library instead, with ffmpeg and llama.cpp.
#
# The CI image, .github/ci-image/Dockerfile, starts from two images pinned
# to a digest. Dependabot moves Ubuntu's digest when the tag gets a new build,
# with the security fixes in it, and the version when there is a newer
# one, both in one pull request a week, which builds the image anew.
#
# Minor and patch versions come together, one pull request a week for the
# Go modules and one for the interface. A new major version comes alone,
# because a major can break the build, and a broken one in the group
# holds back every patch beside it. The actions stay in one pull request
# with their majors: an action's major is mostly the Node it runs on, and
# CI runs every one of them. Each action is pinned to a commit with its full
# version in the comment beside it, # v7.0.2 and never # v7, and Dependabot
# moves the two together. scripts/pins.sh checks it.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: github.com/wailsapp/wails/v3
      - dependency-name: github.com/k2-fsa/sherpa-onnx-go*
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@wailsio/runtime"
      # svelte-check, which checks the interface's types, takes TypeScript
      # 5 or 6 and npm will not install it beside 7. Take this out once a
      # svelte-check release accepts 7.
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      interface:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /.github/ci-image
    schedule:
      interval: weekly
    # The image's Node is the one .node-version pins, which Dependabot
    # cannot move, so scripts/upstream.sh watches both and they move
    # together. scripts/pins.sh fails when they part, #591.
    ignore:
      - dependency-name: node
    groups:
      ci-image:
        patterns: ["*"]
  # The Python packages CI installs, requirements.txt, with their hashes.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
