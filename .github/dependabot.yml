# Dependabot opens a pull request when a Go module, a package of the
# interface, an action or a Python package in requirements.txt has a newer
# version, once a week, and at once for a security fix when Dependabot
# security updates are on in the settings.
# See docs/BUILD.md, Keeping up.
#
# Wails comes in a pull request of its own, the Go module and
# @wailsio/runtime together, because the two must be the same version and
# the build fails when they are not. The group wails below spans Go and
# npm for that, and the go and interface entries leave both out, so
# neither ever comes alone. Wails was left out altogether before, and sat
# on a beta with published security advisories for two months, #843.
#
# Left out, because it moves with something Dependabot cannot change: the
# speech library, whose native libraries scripts/speech-libs.sh pins by
# checksum beside the Go module's version. scripts/upstream.sh watches it
# instead, with ffmpeg and llama.cpp.
#
# The CI image, scripts/ci-image/Dockerfile, starts from images pinned to
# a digest. Dependabot moves Ubuntu's digest when the tag gets a new build,
# with the security fixes in it, in one pull request a week, which builds
# the image anew. Ubuntu stays on 24.04, the system the runners run, whose
# ffmpeg cache the jobs in the image use: a newer Ubuntu is a change to
# the runners too, made by hand. Go's image moves only within the Go
# go.mod names: a newer Go is taken in go.mod first, by hand, and
# internal/workflows fails when the two part, so a newer one in the group
# would hold back Ubuntu's fixes beside it.
#
# Nothing Dependabot moves, but for the actions, lies under .github/.
# GitHub refuses a pull request that changes a file there from every
# other ecosystem, "invalid or unauthorized changes", which is how the
# CI image, under .github/ until then, got no update for a month.
# internal/workflows fails on such a directory.
#
# A new version waits a week before it is taken, see cooldown below
# each ecosystem, so a hijacked release is caught by the people who
# watch for that before it reaches a pull request here. GitHub's own
# wait, when none is set, is three days. A security update never waits.
#
# Minor and patch versions come together, one pull request a week for the
# Go modules and one for the interface. A new major version comes alone,
# because a major can break the build, and a broken one in the group
# holds back every patch beside it. The actions stay in one pull request
# with their majors: an action's major is mostly the Node it runs on, and
# CI runs every one of them. Each action is pinned to a commit with its full
# version in the comment beside it, # v7.0.2 and never # v7, and Dependabot
# moves the two together. internal/workflows checks it.
version: 2
multi-ecosystem-groups:
  wails:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: gomod
    cooldown:
      default-days: 7
    directory: /
    patterns: ["github.com/wailsapp/wails/v3"]
    multi-ecosystem-group: wails
  - package-ecosystem: npm
    cooldown:
      default-days: 7
    directory: /frontend
    patterns: ["@wailsio/runtime"]
    multi-ecosystem-group: wails
  - package-ecosystem: gomod
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: weekly
    # Every module go.sum holds, the ones marked indirect too. Left to
    # itself Dependabot moves only the modules go.mod requires by name,
    # so golang.org/x/text stayed on a version with a known flaw for
    # months, #844.
    allow:
      - dependency-type: all
    ignore:
      # In the group wails, with its runtime, see the head of this file.
      - dependency-name: github.com/wailsapp/wails/v3
      - dependency-name: github.com/k2-fsa/sherpa-onnx-go*
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    cooldown:
      default-days: 7
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # In the group wails, with the Go module, see the head of this file.
      - dependency-name: "@wailsio/runtime"
      # svelte-check, which checks the interface's types, takes TypeScript
      # 5 or 6 and npm will not install it beside 7. Take this out once a
      # svelte-check release accepts 7.
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      interface:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    # The workflows, and the setup every CI job shares.
    directories: [/, /.github/actions/prepare, /.github/actions/save]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    cooldown:
      default-days: 7
    directory: /scripts/ci-image
    schedule:
      interval: weekly
    # The image's Node is the one .node-version pins, which Dependabot
    # cannot move, so scripts/upstream.sh watches both and they move
    # together. internal/workflows fails when they part, #591.
    ignore:
      - dependency-name: node
      - dependency-name: golang
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Its digest still moves, see the head of this file. Dependabot
      # cannot tell what kind of update 24.04 to 26.04 is, so a range.
      - dependency-name: ubuntu
        versions: [">24.04"]
    groups:
      ci-image:
        patterns: ["*"]
  # The Python packages CI installs, requirements.txt, with their hashes.
  - package-ecosystem: pip
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
