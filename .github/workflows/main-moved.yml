# Tells each open pull request, with a comment, when main no longer merges
# into it and which files do not. The comment is what wakes the Claude
# session watching the pull request, which then merges main in, resolves
# the conflicts, runs the checks and pushes. The work is in
# scripts/main-moved.sh.
#
# It runs on every push to main, for every open pull request, and whenever
# a pull request is opened or pushed to, for that one alone. A branch
# started from a main that has moved on since is in conflict from its
# first push, and no push to main follows to say so.
name: Main moved

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

# Runs for the same thing are told in turn, never at once, so no pull
# request is told twice about the same move. A run that waits is replaced
# by a newer one of its group, which is fine within a group because the
# newer one sees everything the older would have. So a pull request has a
# group of its own, and a push to a pull request never replaces a run for
# a push to main.
concurrency:
  group: main-moved-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  tell:
    # A fork's pull request gets a token that cannot comment, and its
    # branch is not ours to speak for.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Main with the whole history, because merging needs the common
      # ancestor. On a pull request too: the default there is GitHub's
      # merge of the two, which does not exist while they conflict, and
      # the script that runs is main's, not the branch's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Tell the open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: sh scripts/main-moved.sh $NUMBER
