# Keeping up with what is found in the code we ship but did not write.
#
# On a pull request that changes the Go modules or the interface's
# packages, and on main every Monday: govulncheck over the Go code, which
# reports only what the code really calls, npm audit over the
# interface's packages, through audit-ci, which lets through only the
# warnings frontend/audit-ci.jsonc names, and osv-scanner over both,
# which knows the packages that are malicious. Any failing is a red check.
#
# Every Monday also scripts/upstream.sh, which compares ffmpeg, the
# libraries it is built with, llama.cpp, the speech library and Node with
# their newest releases. While anything is behind, one issue says so and
# is kept up to date, and it is closed once everything is current. An issue is
# what reaches Tim: GitHub tells whoever watches the repository.
# See docs/BUILD.md, Keeping up.
name: Security

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - go.mod
      - go.sum
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/audit-ci.jsonc
      - .github/workflows/security.yml

permissions:
  contents: read

# A new push to a pull request stops the check of the one before. The
# weekly run is never stopped.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yml

  # In the CI image, see ci-image.yml, because govulncheck compiles the
  # app's package, which needs GTK and WebKit, and the image has them
  # without asking the Ubuntu mirror. The image is public, so a pull from
  # it needs no login.
  go:
    needs: image
    runs-on: ubuntu-24.04
    container: ${{ needs.image.outputs.ref }}
    # A container runs a step with sh, see the walks in ci.yml.
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The checkout is the runner's user's and the job runs as root, see
      # the walks in ci.yml.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      # The interface is embedded in the app, and Go wants the folder.
      - name: An interface to embed
        run: mkdir -p cmd/framefairy-app/dist/app && touch cmd/framefairy-app/dist/app/index.html
      # Pinned like everything else here. Raising it is a line in a pull
      # request, where it can be read first.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # OSV's database, which lists the packages known to be malicious
      # too, the MAL entries, where govulncheck and npm audit read only
      # flaws. Over the Go modules and the interface's packages, after
      # govulncheck even when that failed. Go's are weighed by what the
      # code calls, which is why it runs here, beside Go and the app's
      # libraries. A release from GitHub, checked against its sha256 here,
      # since Dependabot does not move it: raising it is a pull request.
      - name: osv-scanner
        if: ${{ !cancelled() }}
        run: |
          OSV=$RUNNER_TEMP/osv-scanner
          curl -sSfL -o "$OSV" https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  $OSV" | sha256sum -c -
          chmod +x "$OSV"
          "$OSV" scan source --lockfile go.mod --lockfile frontend/package-lock.json

  npm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Everything, not only what ships: the build tools make the bundle
      # that does. Every warning fails, low ones too, but for the ones
      # audit-ci.jsonc lets through by number and path, each with why,
      # issue #579. audit-ci is IBM's, one of the interface's packages, so
      # package-lock.json locks it with everything it brings. Installed
      # without running any package's scripts, since only audit-ci runs.
      - name: npm audit
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install audit-ci --config audit-ci.jsonc

  upstream:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      # To check the release tool's signature.
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # main's own build of the tool, signed, from no cache anybody else
      # wrote, see .github/actions/release-tool.
      - uses: ./.github/actions/release-tool
      # upstream.sh says what is behind, and framefairy-release keeps the
      # issue from its answer, see cmd/framefairy-release/behind.go.
      - name: Newer releases of what we ship
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          status=0
          sh scripts/upstream.sh --behind > "$RUNNER_TEMP/behind.md" || status=$?
          framefairy-release behind -status "$status" -table "$RUNNER_TEMP/behind.md"

  # A run that fails on main tells of itself, in an issue of its own, see
  # tell.yml. A run by hand on a branch is its session's to read, and a
  # run that was stopped is no failure.
  tell:
    needs: [image, go, npm, upstream]
    if: failure() && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      issues: write
      attestations: read
    uses: ./.github/workflows/tell.yml
