# Signs and publishes the builds builds.yml makes, and keeps the channel
# list the app updates itself from. See docs/UPDATES.md.
#
# builds.yml runs a branch's own code, so main's copy of it asks for no
# secret and no token that can write. That is no wall: a push runs the
# workflow file of the branch pushed, and whatever that file asks for, any
# branch can ask for. What holds is the environment below. This workflow is
# started by GitHub whenever builds.yml starts or ends, and GitHub always
# runs it from main, whatever branch the build was of. So the update key,
# the token that writes the release and the tools that use them are
# main's, and nothing a branch holds runs beside them.
#
# The key is read in the environment called updates. Kept there, and that
# environment limited to main in the repository's settings, no branch can
# read it, not even one that rewrites this file: a branch's copy of this
# file is never what runs, and a branch's copy of builds.yml cannot enter
# an environment limited to main.
#
# From the build it takes the zip and nothing else. Which channel it is,
# which commit and which version, it works out again from GitHub's own
# record of the run, by the same rules builds.yml goes by. A build is still
# a branch's code, so what the zip holds is as trusted as the branch: the
# key is the development key, which only development builds carry.
#
# The record alone is not enough. GitHub starts this workflow for any run
# of a workflow named "Builds to update to", whatever file it came from,
# and a tag pushed with the name main gives a run whose branch reads main.
# A branch that runs its own builds.yml on tags could push a tag called
# main at any commit and have it signed as main's build. So only a push
# run of builds.yml is published, and only a commit that main's history
# holds, or the history of the pull request's newest commit.
#
# Four jobs, each step one command of cmd/framefairy-release, which
# makes every decision in Go, see
# docs/decisions/2026-11-14-update-decisions-in-go.md:
#
# 1. announce, the moment a build starts, writes the channel list again,
#    so the Updates page says for the whole of the build that the build it
#    offers is not the newest.
# 2. plan, on Linux, asks whether there is anything to publish, so a run
#    that publishes nothing takes no Mac.
# 3. publish, on a Mac, per channel, one after another and never stopped
#    half way, checks that the commit is its channel's, checks the build,
#    signs it again with the Developer ID, packs it in parts, signs the
#    zip and the stored zip with the update key, uploads the zip with
#    the stored zip packed with zstd, its parts, the pieces the release
#    lacks and its entry to the release dev, and marks a pull request's
#    commit ready to update to. A build it does not
#    publish says why on its commit.
# 4. list, whenever a build ends, however it ended, writes the list again
#    from every entry. It takes away the entry of any pull request that is
#    not open any more, which is how a closed pull request leaves the
#    list, and stops saying a build is coming once it ended without one.
#
# announce and list share one queue, and each writes the list from what is
# there when it runs, so the order they run in does not matter, and one
# that GitHub cancels in the queue loses nothing the next one does not
# write. Nothing that only one of them does may live in them. So both,
# once the list is written, cancel a publish that has waited half an hour
# to enter the environment, see unstick in channels.go: on 7 October one
# of main waited for good, and main stayed on that day's build for three
# days. A wait is not a running job, so timeout-minutes does not end it.
name: Publish builds

on:
  # zizmor: ignore[dangerous-triggers] on purpose, see the head of this file, every job checks head_repository
  workflow_run:
    workflows: ["Builds to update to"]
    types: [requested, completed]

permissions: {}

jobs:
  announce:
    if: >-
      github.event.action == 'requested' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: builds-list
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      # What became of a commit's build, and the publish runs that wait.
      actions: write
      statuses: read
      # To check the release tool's signature.
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # main's own build of the tool, signed, from no cache anybody else
      # wrote, see .github/actions/release-tool.
      - uses: ./.github/actions/release-tool
      - name: Write the channel list from every entry
        run: framefairy-release channels
      - name: Cancel a publish stuck before the environment
        run: framefairy-release unstick

  # Whether there is anything to publish, asked on Linux, so a run that
  # publishes nothing, a commit built already, a branch with no open pull
  # request, takes no Mac. publish asks again on the Mac, where its answer
  # is the one that counts, since a pull request can close in between.
  plan:
    if: >-
      github.event.action == 'completed' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.path == '.github/workflows/builds.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
      # To check the release tool's signature.
      attestations: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    outputs:
      run: ${{ steps.which.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-tool
      - id: which
        name: Is there anything to publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: framefairy-release publish-plan -run "$RUN" -branch "$BRANCH" -commit "$SHA"
      # A plan that fails publishes nothing, and says so on the commit,
      # as a publish that fails does.
      - name: Say on the commit why it is not published
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: framefairy-release not-published -commit "$SHA" -run "$RUN"

  publish:
    needs: plan
    if: >-
      needs.plan.outputs.run == 'true' &&
      github.event.action == 'completed' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.path == '.github/workflows/builds.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # On a Mac, for codesign and the keychain, see "Sign it with the
    # Developer ID" below. Only a build that is published takes it.
    runs-on: macos-latest
    timeout-minutes: 20
    environment: updates
    concurrency:
      group: builds-publish-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      actions: read
      statuses: write
      # To check the release tool's signature.
      attestations: read
    # The token is handed only to the steps that ask GitHub, so the step
    # that reads the build holds nothing that can write.
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # main, the default for a workflow_run, never the branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # main's own build of the tool for a Mac, signed, from no cache
      # anybody else wrote, see .github/actions/release-tool.
      - uses: ./.github/actions/release-tool

      # What the build is a build of, from GitHub's record of the run and
      # not from anything the build wrote, and only a commit its channel's
      # history holds, #838. See publishPlan in plan.go.
      - id: which
        name: What this is a build of
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: framefairy-release publish-plan -run "$RUN" -branch "$BRANCH" -commit "$SHA"

      - if: steps.which.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: ${{ runner.temp }}/build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The build is a branch's code, read here before anybody reviewed
      # it, so this step does not hold a key: nothing needs one until the
      # reading is done, and a zip made to trip the reader finds no key
      # and no token to take. The steps after it run only when it passed.
      - id: check
        if: steps.which.outputs.run == 'true'
        name: Check what it could reach
        run: framefairy-release check -zip "$RUNNER_TEMP/build/app.zip" -refusal "$RUNNER_TEMP/refused.txt"

      # Every build the user gets is signed again with their Developer ID
      # and the hardened runtime, so no other program can put its code
      # into the app, and macOS knows the app again after an update and
      # does not ask for Documents or the keychain anew. Until
      # build/team-id.txt names the team, harden says so and the build
      # stays signed ad hoc, the way it is made. Once it does, a build
      # without the Developer ID is never published. See
      # cmd/framefairy-release/devid.go and docs/UPDATES.md, The Developer ID.
      - id: harden
        if: steps.check.outcome == 'success'
        name: Sign it with the Developer ID
        env:
          FRAMEFAIRY_DEVELOPER_ID: ${{ secrets.FRAMEFAIRY_DEVELOPER_ID }}
          FRAMEFAIRY_DEVELOPER_ID_PASSWORD: ${{ secrets.FRAMEFAIRY_DEVELOPER_ID_PASSWORD }}
        run: framefairy-release harden -zip "$RUNNER_TEMP/build/app.zip" -refusal "$RUNNER_TEMP/refused.txt"

      # The zip the build left deflates every file. Packed again, each
      # file is stored as it is, and its parts and pieces let an app that
      # knows them download only the files it does not have, and the
      # stored zip packed with zstd is what it downloads when they fail.
      # Both zips are signed. The zip the build left is still published
      # for the apps from before. Packed after harden, so its parts are
      # of the build the user gets. See docs/UPDATES.md.
      - id: pack
        if: steps.harden.outcome == 'success'
        name: Pack it in parts
        run: framefairy-release pack -zip "$RUNNER_TEMP/build/app.zip" -out "$RUNNER_TEMP/packed"

      - id: sign
        if: steps.check.outcome == 'success'
        name: Sign it
        env:
          FRAMEFAIRY_UPDATE_KEY: ${{ secrets.FRAMEFAIRY_UPDATE_KEY }}
          CHANNEL: ${{ steps.which.outputs.channel }}
          NAME: ${{ steps.which.outputs.name }}
          VERSION: ${{ steps.which.outputs.version }}
          COMMIT: ${{ steps.which.outputs.commit }}
          URL: https://github.com/${{ github.repository }}/releases/download/dev/${{ steps.which.outputs.zip }}
        # Once build/team-id.txt names the team, sign reads it and refuses
        # a build that is not signed with its Developer ID and the hardened
        # runtime throughout, so it is never lost on the way unseen.
        run: >-
          framefairy-release sign -zip "$RUNNER_TEMP/build/app.zip" -parts "$RUNNER_TEMP/packed/parts.json"
          -channel "$CHANNEL" -name "$NAME"
          -version "$VERSION" -commit "$COMMIT" -url "$URL" -out "$RUNNER_TEMP/entry.json" -refusal "$RUNNER_TEMP/refused.txt"

      # The zip first and its entry after, and a pull request's commit
      # marked ready the moment its entry is up, #839. See publish.go.
      - if: steps.sign.outcome == 'success'
        name: Upload the build and its entry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP: ${{ steps.which.outputs.zip }}
          CHANNEL: ${{ steps.which.outputs.channel }}
        run: >-
          framefairy-release publish -zip "$RUNNER_TEMP/build/app.zip" -as "$ZIP"
          -packed "$RUNNER_TEMP/packed" -entry "$RUNNER_TEMP/entry.json" -channel "$CHANNEL" -commit "$SHA"

      # Whatever failed, the refusal of the check or the signer, or any
      # step on the way, says so on the commit that was built, where the
      # pull request shows it, issue #369. The list reads it too: a commit
      # marked so has no build coming, #840.
      - name: Say on the commit why it is not published
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: framefairy-release not-published -commit "$SHA" -run "$RUN" -refusal "$RUNNER_TEMP/refused.txt"

  # Whenever a build ends, whether publish signed it, skipped it or
  # refused it: a build that ended without one is a build no longer to
  # come, and the list stops saying it is. A pull request that is closed
  # builds nothing and leaves the list this way too.
  list:
    needs: [plan, publish]
    if: >-
      always() &&
      github.event.action == 'completed' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: builds-list
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      # What became of a commit's build, and the publish runs that wait.
      actions: write
      statuses: read
      # To check the release tool's signature.
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # main's own build of the tool, signed, from no cache anybody else
      # wrote, see .github/actions/release-tool.
      - uses: ./.github/actions/release-tool
      - name: Write the channel list from every entry
        run: framefairy-release channels
      - name: Cancel a publish stuck before the environment
        run: framefairy-release unstick
