# Builds framefairy-release from the checkout, signs it with a build
# attestation and, on main, keeps it as the asset of the release
# release-tool that .github/actions/release-tool downloads, so the jobs
# that hold a key run main's own build of main's own code, built from no
# cache, without each building it again. See
# docs/decisions/2026-11-24-the-release-tool-built-once.md.
#
# builds.yml calls it on a push to main when its job which found no
# signed build that fits main's code, since only the tool knows what it
# is built from, see
# docs/decisions/2026-11-25-the-release-tool-keys-itself.md. So no job
# of its own asks on every push. A called workflow signs as this file,
# so the signature still names release-tool.yml. The job holds main's
# signing identity and runs nothing it downloaded. Started by hand on a
# branch, it builds and signs and keeps the tool as an artifact of the
# run, and uploads nothing: only main's build is the release's.
name: Release tool

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-tool
        with:
          download: "false"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-tool/built/framefairy-release
      - if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: framefairy-release
          path: ${{ runner.temp }}/release-tool/built/framefairy-release
          retention-days: 3
      # The release holds the one file the jobs download. What makes a job
      # trust it is main's signature and its fingerprint, never that it is
      # there: a job of an older commit finds a build of newer code, which
      # does not fit, and builds.
      - if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: framefairy-release keep -file "$RUNNER_TEMP/release-tool/built/framefairy-release"
