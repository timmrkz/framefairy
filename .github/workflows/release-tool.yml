# Builds framefairy-release on main whenever main's signed build no
# longer fits main's code, signs it with a build attestation and keeps it
# as the asset of the release release-tool that
# .github/actions/release-tool downloads, so the jobs that hold a key run
# main's own build of main's own code, built from no cache, without each
# building it again. See
# docs/decisions/2026-11-24-the-release-tool-built-once.md.
#
# It starts on every push to main, since only the tool knows what it is
# built from, see docs/decisions/2026-11-25-the-release-tool-keys-itself.md.
# The job check asks the signed build whether it fits, with a token that
# only reads. Only when it does not, the job build, which holds main's
# signing identity, builds the tool from the checkout and runs nothing it
# downloaded. On main it keeps the build and takes the signature of every
# older build away. Started by hand on a branch, it builds and signs and
# keeps the tool as an artifact of the run, takes the signature away
# again and uploads nothing: only main's build is the release's.
name: Release tool

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One at a time and never stopped half way, so the newest build is the
# one the release keeps.
concurrency:
  group: release-tool-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    outputs:
      built: ${{ steps.tool.outputs.built }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tool
        uses: ./.github/actions/release-tool

  build:
    needs: check
    if: needs.check.outputs.built == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-tool
        with:
          download: "false"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-tool/framefairy-release
      - if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: framefairy-release
          path: ${{ runner.temp }}/release-tool/framefairy-release
          retention-days: 3
      # Only the newest build is kept and signed: keep takes the signature
      # of every older build away, so none can be put back for a job to
      # run. A job of an older commit finds a build of newer code, which
      # does not fit, and builds.
      - if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: framefairy-release keep -file "$RUNNER_TEMP/release-tool/framefairy-release"
      # A branch's build is never taken. Its signature is taken away again,
      # which shows the token may do what keep does on main.
      - if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: framefairy-release unsign -file "$RUNNER_TEMP/release-tool/framefairy-release"
