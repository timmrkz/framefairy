# Builds framefairy-release on main whenever main's signed build no
# longer fits main's code, signs it with a build attestation and keeps it
# as the asset of the release release-tool that
# .github/actions/release-tool downloads, so the jobs that hold a key run
# main's own build of main's own code, built from no cache, without each
# building it again. See
# docs/decisions/2026-11-24-the-release-tool-built-once.md.
#
# It starts on every push to main, since only the tool knows what it is
# built from, see docs/decisions/2026-11-25-the-release-tool-keys-itself.md.
# The action asks the signed build whether it fits, and builds the tool
# here when it does not. Only then is there anything to sign. Started by
# hand on a branch, it builds and signs and keeps the tool as an artifact
# of the run, and uploads nothing: only main's build is the release's.
name: Release tool

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One at a time and never stopped half way, so the newest build is the
# one the release keeps.
concurrency:
  group: release-tool-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tool
        uses: ./.github/actions/release-tool
      - if: steps.tool.outputs.built == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-tool/framefairy-release
      - if: steps.tool.outputs.built == 'true' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: framefairy-release
          path: ${{ runner.temp }}/release-tool/framefairy-release
          retention-days: 3
      # The release is a prerelease and never the latest, and keeps only
      # the newest build: a job of an older commit finds a build of newer
      # code, which does not fit, and builds.
      - if: steps.tool.outputs.built == 'true' && github.ref == 'refs/heads/main'
        name: Keep it in the release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: framefairy-release
        run: |
          gh release view release-tool >/dev/null 2>&1 || gh release create release-tool --prerelease --latest=false --title "Release tool" --notes "The build of framefairy-release the workflows run, see .github/workflows/release-tool.yml."
          gh release upload release-tool "$RUNNER_TEMP/release-tool/$NAME" --clobber
          gh release view release-tool --json assets --jq '.assets[].name' | grep -vxF "$NAME" | xargs -r -n1 gh release delete-asset release-tool -y
