# The Go tests on a Mac, once a night on main, so a pull request does not
# wait for them and does not fail by them. See Mac tests at night in
# docs/BUILD.md.
#
# GitHub's Mac is a virtual Mac, and its media engine, VideoToolbox, now
# and then stops answering. Every stack kept of such a hang is in the
# call from the virtual Mac to the machine it runs on, which never came
# back, in creating a decoder and in the decoder. Encoders hung the same
# way, Apple's encoder on the processor, -require_sw, among them, before
# any stack was kept. Whatever test waits on it waits with no end, and
# its package runs into its -timeout. Not once in Tim's 104 report logs.
# A Mac has no other encoder for a short, so the Mac's tests cannot leave
# the media engine out, and they run here, where a hang stops no pull
# request, and scripts/test-failures.sh names it as the virtual Mac's.
# The code all machines share is tested on Linux on every pull request.
# What only a Mac builds or does waits for the night, unless the pull
# request starts this workflow on its branch, see Mac tests at night.
name: Nightly Mac tests

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERYTHING: "1"
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
  UNITTIMEOUT: 4m
  SLOWEST: 5s

jobs:
  # The Go tests on Tim's platform, against the ffmpeg we ship, built by
  # the same script a release uses, so what renders here is what renders
  # on a customer's Mac: LGPL, without libx264, encoding through
  # VideoToolbox. The build takes a while once and is kept until
  # scripts/build-ffmpeg.sh changes.
  #
  # make unit on a Mac leaves out the race detector and the licence
  # server's packages, see the Makefile, the same as on Tim's Mac. What
  # differs here, decoding, encoding, the disk, the keychain, is all
  # tested. The build with no warnings allowed is in the job outside of
  # ci.yml, on every pull request.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Go's build cache, kept by main after every push, see above the job
      # linux.
      - id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-v1-macos-${{ runner.os }}-${{ github.sha }}
          restore-keys: go-v1-macos-${{ runner.os }}-
      # The checksum of the pins of the tools that build them, in the
      # keys below, so a newer tool builds them again, see
      # scripts/build-tools.sh.
      - id: tools
        run: echo "recipe=$(sh scripts/build-tools.sh --recipe)" >> "$GITHUB_OUTPUT"
      - id: ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}-${{ steps.tools.outputs.recipe }}
      # What builds the ffmpeg we ship, at the versions requirements.txt
      # pins, see scripts/build-tools.sh. With the ffmpeg from the cache,
      # only pkg-config, with which the episode's decoder finds its
      # libraries.
      - name: What builds them
        run: |
          sh scripts/build-tools.sh .build/tools ${{ steps.ffmpeg.outputs.cache-hit == 'true' && 'pkgconf' || '' }}
          echo "$PWD/.build/tools/bin" >> "$GITHUB_PATH"
      - name: The ffmpeg we ship
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: sh scripts/build-ffmpeg.sh .build/ffmpeg
      - name: ffmpeg on the path, for the tests
        run: |
          .build/ffmpeg/bin/ffmpeg -hide_banner -encoders | grep videotoolbox
          echo "$PWD/.build/ffmpeg/bin" >> "$GITHUB_PATH"
      # With a limit and a look at what is left, as in the job linux of
      # ci.yml.
      - name: Go tests
        timeout-minutes: 15
        run: |
          make frames
          make changed PART=unit 2>&1 | tee unit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then sh scripts/test-failures.sh unit.log; fi
          exit "$status"
      - name: Nothing left running
        if: always()
        run: sh scripts/leftovers.sh
      - if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || steps.gocache.outputs.cache-matched-key == '') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-v1-macos-${{ runner.os }}-${{ github.sha }}
