# Runs on every pull request and on every push to main.
#
# The work is split across machines that run at the same time, because none
# of it needs any of the rest: the interface type check does not care whether
# the fuzzing found anything, and the fuzzing does not care whether the app
# links on macOS. Run one after another they take about six minutes, and the
# answer arrives when the slowest one does instead.
#
# On a pull request the job changes first reads which files changed, with
# dorny/paths-filter and the filters in .github/ci-filters.yml, and a job
# with nothing to do never starts a machine. GitHub shows it as skipped,
# and a skipped job counts as passed for a required check. So a change to
# the docs does not fuzz two platforms, and a change to the interface does
# not run the Go tests. The filters err towards running: a test that runs
# when it need not costs a minute, one that does not run when it should
# have costs a broken main. The Go jobs then narrow further, to the
# packages and fuzz targets make changed picks for the change, see
# scripts/changed.sh.
#
# A push to main narrows nothing. Whatever it touched, everything is built
# and tested, so main is always known to be sound and a mistake in the rules
# can never be what hides a break.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Reading the code is all CI does, so its token can do nothing more.
permissions:
  contents: read

# A second push makes the first answer worthless, so it is stopped rather
# than left to finish. It frees the runners for the push that replaced it.
# Never on main, where every commit's result is worth having on its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# A cache whose download stalls is given up after a minute, and the job
# goes on as if there were no cache, where it would wait ten. Restoring the
# walks' system packages once took 2 min 22 s on one runner and 3 s on the
# others, which put the job at seven minutes.
env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1

jobs:
  # Which jobs a pull request needs, see .github/ci-filters.yml. A push to
  # main needs them all. The action asks GitHub for the files the pull
  # request changed, which takes reading pull requests, and the checkout
  # brings the filters and nothing else.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ github.event_name != 'pull_request' || steps.filter.outputs.app == 'true' }}
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      interface: ${{ github.event_name != 'pull_request' || steps.filter.outputs.interface == 'true' }}
      workflows: ${{ github.event_name != 'pull_request' || steps.filter.outputs.workflows == 'true' }}
      changed: ${{ github.event_name != 'pull_request' || steps.filter.outputs.changed == 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/ci-filters.yml
          sparse-checkout-cone-mode: false
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/ci-filters.yml
          predicate-quantifier: some-with-excludes

  # First back, by a long way, and the one most changes touch. It needs Node
  # and nothing else: no Go, no system libraries, no build.
  interface:
    needs: changes
    if: needs.changes.outputs.interface == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # ESLint among it, see frontend/eslint.config.js.
      - name: Type check and interface tests
        run: make interface

  # Builds everything, the interface included, which is what proves the
  # programs still link and that Go can embed what make built.
  build:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      # Two commits, for the main the merge commit sits on, which the
      # clock lint and the check of the plan compare against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # Node for the check of the CI rules, which matches with the
      # picomatch the action uses, and for the build.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Always, whatever changed. A mistake in the rules that decide what
      # runs is silent: CI goes green having run less than it should. This
      # takes seconds and it is the one thing nothing else would catch.
      - name: Check the CI rules
        run: sh scripts/ci-filters-test.sh
      # And the rule that decides whether a push gets a build to update to,
      # which is as silent when it is wrong.
      - name: Check the rule for a build
        run: sh scripts/needs-build-test.sh
      # And the script that tells a pull request main no longer merges
      # into it, which is as silent when it is wrong.
      - name: Check the Main moved notice
        run: sh scripts/main-moved-test.sh
      # And that the plan stays history. Open work is GitHub issues, since
      # every pull request adding a row to the same table conflicted with
      # every other. The test first, so a broken check cannot pass.
      - name: Check the plan is left alone
        run: |
          sh scripts/plan-frozen-test.sh
          sh scripts/plan-frozen.sh
      # And, when a workflow changed, that every action is pinned to a
      # commit with its full version beside it, so a bump says which
      # release it moves to. Nothing else can change a pin.
      - name: Check the action pins
        if: needs.changes.outputs.workflows == 'true'
        run: sh scripts/pins.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # And, whatever changed, the one Go test that reads the interface,
      # the docs and the scripts whole, for the endings of a video. Those
      # files start no Go tests, so without this a pull request that names
      # the endings a second time would go green and break main.
      - name: Check the video endings are named once
        run: go test -run '^TestVideosAreNamedOnce$' ./engine
      # And what make changed runs for a change, which is as silent when it
      # is wrong: the check before a push goes green having run less than
      # the change needed. It reads the packages with Go, so it runs
      # whenever Go is set up, which a change to its rules alone does too.
      # It took 7 s here, in one run.
      - name: Check what make changed runs
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.changed == 'true'
        run: sh scripts/changed-test.sh
      # The packages apt downloaded, kept for a week and for this job's
      # list, so a run downloads only what changed. See ci-packages.sh.
      - id: week
        if: needs.changes.outputs.app == 'true'
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - if: needs.changes.outputs.app == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt
          key: apt-build-${{ steps.week.outputs.week }}-${{ hashFiles('scripts/ci-packages.sh') }}
          restore-keys: apt-build-
      - name: System packages
        if: needs.changes.outputs.app == 'true'
        timeout-minutes: 10
        run: sh scripts/ci-packages.sh patchelf
      # make tidies go.mod and go.sum quietly, so a change that leaves them
      # untidy builds everywhere and is committed that way. This says so,
      # before make has had the chance to tidy them.
      - name: go.mod is tidy
        if: needs.changes.outputs.app == 'true'
        run: go mod tidy -diff
      # Without the tools we ship, which this runner does not build: it
      # proves the programs link, and NOTOOLS says so rather than make
      # stopping for want of them.
      - name: Build
        if: needs.changes.outputs.app == 'true'
        run: make NOTOOLS=1
      # With the interface's packages installed by the build, ./... is our
      # packages and nothing else. One of them, flatted, ships a Go port,
      # which the ignore in go.mod keeps out, #471.
      - name: Only our Go packages
        if: needs.changes.outputs.app == 'true'
        run: |
          pkgs=$(go list ./...)
          if printf '%s\n' "$pkgs" | grep /node_modules/; then
            echo "go list ./... takes in the packages above, see the ignore in go.mod"
            exit 1
          fi
      # No new Go test waits on the clock, see .golangci.yml. make
      # installs nothing here, so this step asks for the golangci-lint the
      # Makefile pins. After the build, whose Go build cache the linter
      # reads. The proof first, so settings that let all through fail.
      - name: No new test waits on the clock
        if: needs.changes.outputs.app == 'true'
        run: |
          make golangci-lint INSTALL=1
          sh scripts/lint-test.sh
          make lint

  # Every Go test under the race detector, which also runs the seed corpus
  # of every fuzz target. ffmpeg is here because the tests that render skip
  # without it, and they are worth having.
  #
  # On three machines, each with the tests of every package whose names
  # start with some letters. The patterns never change, because Go keys
  # its test cache on them, so a package a change does not reach says
  # (cached) whatever tests were added elsewhere. Every test runs once,
  # since -skip takes exactly what the two -run leave, fuzz seeds among
  # it. The engine's tests whose names start with A are a third of all
  # the time, so they are split by their second letter. The cache is
  # keyed by the pattern, since one made with another pattern holds no
  # result for this one. On one machine the tests took six minutes, and no job takes over
  # five. Split by package, the app with the small packages took 208 s
  # on one machine, in one run, because the app's tests run one after
  # another.
  #
  # Go's build cache: setup-go keeps it by go.sum alone and saves it only
  # when go.sum changes, so a job started from one that was weeks old and
  # compiled nearly everything again, a minute here and close to two on a
  # Mac. The jobs that compile most, linux, walks and macos, take theirs
  # from the cache main saved last, one for each job, because each
  # compiles with other flags, and one for each machine of linux, since
  # each keeps the results of other tests. Main saves it after every
  # push. A pull
  # request saves one only when it found none, before main has saved one
  # or after GitHub dropped it, so its next push starts warm. Otherwise it
  # saves nothing: a cache a pull request writes is its own, and the
  # upload would cost every run.
  #
  # The name has no matrix in it, and the matrix holds only the name of
  # each machine's tests. A job its if skips is never split into its
  # machines, so a name made from the matrix showed as written, as
  # linux (${{ matrix.tests }}), #476. GitHub adds the matrix's values to
  # a name without one, so the machines are linux (A-AR+B-O) and the
  # others when they run, and one linux when they are skipped. The step
  # shard turns each into its pattern.
  linux:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: linux
    strategy:
      fail-fast: false
      matrix:
        tests: [A-AR+B-O, AS-AZ+P-S, rest]
    runs-on: ubuntu-24.04
    steps:
      - id: shard
        env:
          TESTS: ${{ matrix.tests }}
        run: |
          case "$TESTS" in
          A-AR+B-O) flags='-run=^Test(A[^S-Z]|[B-O])' ;;
          AS-AZ+P-S) flags='-run=^Test(A[S-Z]|[P-S])' ;;
          rest) flags='-skip=^Test(A[^S-Z]|[B-O])|^Test(A[S-Z]|[P-S])' ;;
          *) echo "no pattern for the tests $TESTS"; exit 1 ;;
          esac
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
      # Two commits, for the main the merge commit sits on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Go's build cache, kept by main after every push, see above the job
      # linux.
      - id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v1-linux-${{ runner.os }}-${{ steps.shard.outputs.flags }}-${{ github.sha }}
          restore-keys: go-v1-linux-${{ runner.os }}-${{ steps.shard.outputs.flags }}-
      # The packages apt downloaded, kept for a week and for this job's
      # list, so a run downloads only what changed. See ci-packages.sh.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt
          key: apt-linux-${{ steps.week.outputs.week }}-${{ hashFiles('scripts/ci-packages.sh') }}
          restore-keys: apt-linux-
      - name: System packages
        timeout-minutes: 10
        run: sh scripts/ci-packages.sh ffmpeg meson ninja-build nasm
      # The episode's decoder, which the tests and the walks play through,
      # built against the ffmpeg we ship, see docs/VIDEO-PREVIEW.md. That
      # ffmpeg is built once and kept until scripts/build-ffmpeg.sh
      # changes. The tests still take the system's ffmpeg from the PATH,
      # because ours has no H.264 encoder on Linux, see TOOLS_FIRST.
      - id: ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: The ffmpeg we ship
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: sh scripts/build-ffmpeg.sh .build/ffmpeg
      - name: The episode's decoder
        run: make frames
      # On a pull request, only the packages make changed picks, see
      # scripts/changed.sh: those that changed and every one that imports
      # them. HEAD is the merge commit GitHub made, so HEAD^1 is main. make
      # unit reads UNITPKGS, and tests every package when it is not set.
      # Right before the tests, because changed.sh asks make what make
      # unit asks, the system packages among it.
      - name: The packages this change reaches
        if: github.event_name == 'pull_request'
        run: |
          plan=$(BASE=HEAD^1 sh scripts/changed.sh --plan)
          echo "UNITPKGS=$(printf '%s\n' "$plan" | sed -n 's/^go //p' | tr '\n' ' ')" >> "$GITHUB_ENV"
      # A test that fails is named on the check, see
      # scripts/test-failures.sh, so finding it needs no log.
      #
      # go test stops a package that runs over ten minutes by itself, with
      # the stack of every goroutine, and the tests take three. The limit is
      # for when even that does not end it: a job once waited half an hour
      # on what a failed test had left running, until it was cancelled by
      # hand.
      - name: Go tests
        timeout-minutes: 15
        run: |
          make unit UNITFLAGS='${{ steps.shard.outputs.flags }}' 2>&1 | tee unit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then sh scripts/test-failures.sh unit.log; fi
          exit "$status"
      # Whichever way the tests ended, what they left running is named on
      # the check and stopped, see scripts/leftovers.sh.
      - name: Nothing left running
        if: always()
        run: sh scripts/leftovers.sh
      - if: always() && (github.ref == 'refs/heads/main' || steps.gocache.outputs.cache-matched-key == '')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v1-linux-${{ runner.os }}-${{ steps.shard.outputs.flags }}-${{ github.sha }}

  # The machine the walks run on, .github/ci-image/Dockerfile: Ubuntu with
  # every system package they use and Playwright's Chromium already in it,
  # so no walks job downloads from the Ubuntu mirror, which on some days
  # held one for twelve minutes, #462. It is kept in GitHub's container
  # registry under a sum of what goes into it: the Dockerfile,
  # scripts/ci-packages.sh, which it runs, and the version of Playwright
  # the interface pins. So nearly every run only asks the registry whether
  # that image is there, and builds and pushes one only when one of them
  # changed. The step that builds stops after ten minutes, as the system
  # packages of the other jobs do.
  image:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/ci-image/Dockerfile
            scripts/ci-packages.sh
            frontend/package-lock.json
          sparse-checkout-cone-mode: false
      - id: tag
        run: |
          playwright=$(jq -r '.packages["node_modules/playwright"].version' frontend/package-lock.json)
          sum=$({ echo "playwright $playwright"; cat .github/ci-image/Dockerfile scripts/ci-packages.sh; } | sha256sum | cut -c1-16)
          echo "playwright=$playwright" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY}-ci:$sum" >> "$GITHUB_OUTPUT"
      - name: The image, unless it is there
        timeout-minutes: 10
        env:
          REF: ${{ steps.tag.outputs.ref }}
          PLAYWRIGHT: ${{ steps.tag.outputs.playwright }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "$REF is there"
            exit 0
          fi
          docker buildx build --push --build-arg PLAYWRIGHT="$PLAYWRIGHT" \
            -t "$REF" -f .github/ci-image/Dockerfile .

  # The interface in Chromium against the real Go side: the sequences of
  # the cases found by hand and the walks, see docs/TESTING.md. It needs
  # what the Go tests need, the interface's Node, and the Chromium
  # Playwright drives, all of it in the image the job image keeps, which
  # the job runs in.
  #
  # On four machines, each with a quarter of the runs by how long they took
  # last, see frontend/preview/walks/walk-times.tsv: on one the runs took
  # five and a half minutes after two of setting up, on two each still took
  # six with a cold build cache, and on three each job took four and three
  # quarters, too close to five. More walkers on a machine of four cores
  # finish no sooner and break walks that wait on the clock.
  #
  # The name has no matrix in it, for the reason above the job linux, so
  # the machines are walks (1/4) to walks (4/4) when they run, and one
  # walks when they are skipped.
  #
  # In the container as root, which is how GitHub runs one, with the IPC
  # of the machine, as Playwright says to for Chromium, whose shared memory
  # would not fit the 64 MB a container has, and with an init process,
  # which Playwright asks for too, so what Chromium leaves behind is
  # reaped. The runners' work folder is also where it is on the machine,
  # because the ffmpeg we ship comes from the cache the job linux fills
  # there, and its pkg-config files name the folder it was built in.
  walks:
    needs: [changes, image]
    if: needs.changes.outputs.app == 'true'
    name: walks
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    # A container runs a step with sh, where ${PIPESTATUS[0]} is no word.
    # bash as a runner has it, without pipefail, so a walk that fails still
    # reaches the step that names it.
    defaults:
      run:
        shell: bash -e {0}
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --ipc=host
      volumes:
        - /home/runner/work:/home/runner/work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The checkout belongs to the runner's user and the job runs as root,
      # so git refuses the folder as someone else's, and go build, which
      # asks git for the commit it stamps, fails with it.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Go's build cache, kept by main after every push, see above the job
      # linux. v2 since the job runs in the image: actions/cache keeps a
      # path by where it lies from the work folder, and the home of a
      # container is another place than a runner's.
      - id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v2-walks-${{ runner.os }}-${{ github.sha }}
          restore-keys: go-v2-walks-${{ runner.os }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The episode's decoder, which the tests and the walks play through,
      # built against the ffmpeg we ship, see docs/VIDEO-PREVIEW.md. That
      # ffmpeg is built once and kept until scripts/build-ffmpeg.sh
      # changes, by the job linux, whose cache this only reads: one built
      # here would name this container's folders, which the machines of
      # linux do not have. The tests still take the system's ffmpeg from
      # the PATH, because ours has no H.264 encoder on Linux, see
      # TOOLS_FIRST.
      - id: ffmpeg
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: The ffmpeg we ship
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: sh scripts/build-ffmpeg.sh .build/ffmpeg
      - name: The episode's decoder
        run: make frames
      # A walk or a sequence that breaks a rule is named on the check, see
      # scripts/test-failures.sh. A share takes about two and a half
      # minutes, so one that hangs is stopped and named after eight rather
      # than holding the machine for the half hour make walks gives by
      # hand.
      - name: Sequences and walks
        id: walks
        run: |
          make walks WALKSHARD=${{ matrix.shard }} WALKTIMEOUT=8m 2>&1 | tee walks.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then sh scripts/test-failures.sh walks.log; fi
          exit "$status"
      # Only after walks that passed: a share that stopped early has built
      # little, and a cache saved from it is found first by every run after.
      - if: steps.walks.outcome == 'success' && (github.ref == 'refs/heads/main' || steps.gocache.outputs.cache-matched-key == '') && matrix.shard == '1/4'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v2-walks-${{ runner.os }}-${{ github.sha }}

  # Looking for new crashers, which is the part that does not need to hold
  # anything else up.
  #
  # Go keeps what it learned in its build cache: the inputs that reached
  # new code, and each package built with the coverage counters fuzzing
  # needs. Both are kept between runs, saved by main and by the nightly
  # fuzzing and taken up by every pull request. So a run goes on from where
  # the last one stopped instead of finding the same easy inputs again, and
  # does not build every package before it starts. What a pull request
  # finds is not saved, because a cache a pull request writes is its own.
  fuzz:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      # Two commits, for the main the merge commit sits on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: fuzz-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: fuzz-v1-${{ runner.os }}-
      # The packages apt downloaded, kept for a week and for this job's
      # list, so a run downloads only what changed. See ci-packages.sh.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt
          key: apt-fuzz-${{ steps.week.outputs.week }}-${{ hashFiles('scripts/ci-packages.sh') }}
          restore-keys: apt-fuzz-
      - name: System packages
        timeout-minutes: 10
        run: sh scripts/ci-packages.sh
      # The licence dispenser's simulation is fuzzed at night only, see
      # SIMTIME in scripts/fuzz.sh. Its known seeds run in the job linux.
      # On a pull request only the targets of the packages the change
      # reaches, as make changed fuzzes them, see scripts/changed.sh,
      # compared with main.
      - name: Fuzz
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            targets=$(BASE=HEAD^1 sh scripts/changed.sh --fuzz-targets)
            if [ -z "$targets" ]; then
              echo "no fuzz target this change reaches"
              exit 0
            fi
            make fuzz SIMTIME=0 FUZZTARGETS="$targets"
          else
            make fuzz SIMTIME=0
          fi
      - if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: fuzz-v1-${{ runner.os }}-${{ github.sha }}

  # The Go tests on Tim's platform, against the ffmpeg we ship, built by
  # the same script a release uses, so what renders here is what renders
  # on a customer's Mac: LGPL, without libx264, encoding through
  # VideoToolbox. The build takes a while once and is kept until
  # scripts/build-ffmpeg.sh changes.
  #
  # Without the race detector: the Go code is the same as on Linux, where
  # every test runs under it, and here it only made them 1.7 times slower.
  # And without the licence server's packages, which run on a Linux server
  # and never on a Mac. What differs here, decoding, encoding, the disk,
  # the keychain, is all still tested. The build with no warnings allowed
  # is in the job outside, which builds the app anyway.
  macos:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: macos-latest
    steps:
      # Two commits, for the main the merge commit sits on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Go's build cache, kept by main after every push, see above the job
      # linux.
      - id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-v1-macos-${{ runner.os }}-${{ github.sha }}
          restore-keys: go-v1-macos-${{ runner.os }}-
      - id: ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: The ffmpeg we ship
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          brew install meson ninja pkg-config nasm cmake
          sh scripts/build-ffmpeg.sh .build/ffmpeg
      - name: ffmpeg on the path, for the tests
        run: |
          .build/ffmpeg/bin/ffmpeg -hide_banner -encoders | grep videotoolbox
          echo "$PWD/.build/ffmpeg/bin" >> "$GITHUB_PATH"
      # The episode's decoder is built against that ffmpeg's libraries,
      # which pkg-config finds. A runner whose ffmpeg came from the cache
      # installed nothing above.
      - name: pkg-config, for the episode's decoder
        run: command -v pkg-config >/dev/null || brew install pkg-config
      # The same packages as in the job linux, see there.
      - name: The packages this change reaches
        if: github.event_name == 'pull_request'
        run: |
          plan=$(BASE=HEAD^1 sh scripts/changed.sh --plan)
          echo "UNITPKGS=$(printf '%s\n' "$plan" | sed -n 's/^go //p' | tr '\n' ' ')" >> "$GITHUB_ENV"
      # With a limit and a look at what is left, as in the job linux.
      - name: Go tests
        timeout-minutes: 15
        run: |
          make frames
          make unit RACE= UNITSKIP='framefairy/licence/dispenser framefairy/licence/paddle framefairy/cmd/framefairy-dispenser' 2>&1 | tee unit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then sh scripts/test-failures.sh unit.log; fi
          exit "$status"
      - name: Nothing left running
        if: always()
        run: sh scripts/leftovers.sh
      - if: always() && (github.ref == 'refs/heads/main' || steps.gocache.outputs.cache-matched-key == '')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-v1-macos-${{ runner.os }}-${{ github.sha }}

  # The app on a Mac, opened from outside it: a link in the letter a buyer
  # gets, handed to macOS with the app closed and with it open, with the
  # local dispenser running beside it. See From outside the app in
  # docs/TESTING.md. Its own job, because it is the only one that needs a
  # keychain of its own, a dispenser and an app registered with Launch
  # Services, and none of that belongs on the machines the other jobs use.
  # It builds the app first, with no warning allowed, which is also the
  # build the Mac has to pass, so the app is built once on a Mac in CI
  # rather than twice.
  outside:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    # The app is opened by macOS and nothing ends it but the test. A run
    # that hangs stops here, not at GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The same ffmpeg and llama-server as the job macos, from the same
      # caches: the app runs no other, so make stops without them.
      - id: ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: The ffmpeg we ship
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          brew install meson ninja pkg-config nasm cmake
          sh scripts/build-ffmpeg.sh .build/ffmpeg
      - name: pkg-config, for the episode's decoder
        run: command -v pkg-config >/dev/null || brew install pkg-config
      - id: llama
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/llama
          key: llama-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-llama.sh') }}
      - name: The llama-server we ship
        if: steps.llama.outputs.cache-hit != 'true'
        run: |
          brew install cmake
          sh scripts/build-llama.sh .build/llama
      # Unlock writes the key to the default keychain. A locked one puts a
      # box on screen that nobody here can answer, so this one is made
      # unlocked, never locks again and becomes the default.
      - name: A keychain of its own
        run: |
          kc="$RUNNER_TEMP/outside.keychain-db"
          security create-keychain -p outside "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p outside "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$kc"
      # Tim's platform, so the build has to be clean: a warning from clang
      # or the linker fails it. make outside builds on what this built.
      - name: Build without warnings
        run: |
          make 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -iE "warning|deprecated" build.log; then
            echo "The build printed warnings, see above."
            exit 1
          fi
      - name: Opened from outside
        run: make outside
