# Every job runs one make command, the same one anybody runs on their own
# machine, see One way to test in docs/BUILD.md. Around it a job has only
# what its machine needs: the checkout and .github/actions/prepare.
#
# A pull request starts only the jobs whose code it changed: the Go jobs
# when Go changed, the interface's tests when the interface changed, and
# the jobs that test the whole app, the build, the walks and the app
# opened from outside, when either did. What counts as which is the two
# filters of the job changes, below. A change to the docs alone starts
# nothing. A push to main starts every job. Inside a Go job Go's own test
# cache, restored from main, runs only the packages whose code changed.
#
# No branch rule requires a check, so nothing waits on a job that was
# never started.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A second push makes the first answer worthless, so it is stopped rather
# than left to finish. Never on main, where every commit's result is worth
# having on its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# A cache whose download stalls is given up after a minute, and the job
# goes on as if there were no cache, where it would wait ten.
#
# A Go test waits on signals, never on the clock, so one whose signal never
# comes hangs. go test ends it after UNITTIMEOUT and prints every
# goroutine, well under a job's five minutes. The checks from outside the
# app end the same way after OUTSIDETIMEOUT.
env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
  UNITTIMEOUT: 4m
  OUTSIDETIMEOUT: 2m

jobs:
  # What the pull request changed, by the files GitHub lists for it. Go is
  # every file outside frontend/, the docs and .claude/, so a script, the
  # Makefile or a workflow is Go, and the files of frontend/ a Go test
  # reads, goread, which internal/workflows holds to what the tests read.
  # The interface is frontend/, the Makefile, the workflows and the Node
  # pin. See One way to test in docs/BUILD.md.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ github.event_name == 'push' || steps.filter.outputs.go == 'true' || steps.filter.outputs.goread == 'true' }}
      interface: ${{ github.event_name == 'push' || steps.filter.outputs.interface == 'true' }}
      app: ${{ github.event_name == 'push' || steps.filter.outputs.go == 'true' || steps.filter.outputs.goread == 'true' || steps.filter.outputs.interface == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            go:
              - '**'
              - '!frontend/**'
              - '!docs/**'
              - '!**/*.md'
              - '!.claude/**'
            goread:
              - 'frontend/src/lib/{api.ts,*.cases.json}'
            interface:
              - '{frontend/**,.github/workflows/**,.github/actions/**,.node-version,Makefile}'

  # The machine the Linux jobs run on, with every system package they use,
  # so none waits on the Ubuntu mirror, see ci-image.yml.
  image:
    needs: changes
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yml

  # Needs Node and nothing else, so it is first back by a long way.
  interface:
    needs: changes
    if: needs.changes.outputs.interface == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make interface

  # make lint, then the programs and the interface built, which proves they
  # still link and that Go can embed what make built. Without the tools we
  # ship, which nothing builds for Linux yet. On every pull request,
  # whatever it changed, since make lint reads the docs and the workflows
  # too, see One way to test in docs/BUILD.md.
  build:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ${{ needs.image.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          key: go-v1-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: go-v1-build-${{ runner.os }}-
          node: npm
      - id: build
        run: make lint all NOTOOLS=1
      - if: github.ref == 'refs/heads/main' && steps.build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v1-build-${{ runner.os }}-${{ github.sha }}

  # The Go tests under the race detector, the seeds of the fuzz targets
  # among them, on three machines, a third of the tests each by their
  # names, see UNITSHARD in the Makefile: on one they took six minutes.
  # Each machine keeps a cache of its own, since each keeps the results of
  # other tests.
  #
  # The runners' work folder is mounted where it is on a runner, because
  # the ffmpeg we ship comes from a cache filled on a runner, and its
  # pkg-config files name the folder it was built in.
  linux:
    needs: [changes, image]
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --init
      volumes:
        - /home/runner/work:/home/runner/work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          key: go-v3-linux-${{ runner.os }}-${{ strategy.job-index }}-${{ github.sha }}
          restore-keys: go-v3-linux-${{ runner.os }}-${{ strategy.job-index }}-
          node: node
          ffmpeg: true
      - id: tests
        run: make unit UNITSHARD=${{ matrix.shard }}
      # Only on main, and only once the tests ran, since they built
      # everything either way. A cache a pull request writes is its own.
      - if: github.ref == 'refs/heads/main' && !cancelled() && steps.tests.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v3-linux-${{ runner.os }}-${{ strategy.job-index }}-${{ github.sha }}

  # The interface in Chromium against the real Go side, see
  # docs/TESTING.md, on four machines, each with a quarter of the walks by
  # how long they took last, frontend/preview/walks/walk-times.tsv. A
  # quarter takes about two and a half minutes, so one that hangs is
  # stopped and named after eight. Playwright asks for the machine's IPC,
  # since Chromium's shared memory does not fit a container's 64 MB, and
  # an init process to reap what it leaves.
  walks:
    needs: [changes, image]
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ needs.image.outputs.walks }}
      options: --init --ipc=host
      volumes:
        - /home/runner/work:/home/runner/work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          key: go-v2-walks-${{ runner.os }}-${{ github.sha }}
          restore-keys: go-v2-walks-${{ runner.os }}-
          node: npm
          ffmpeg: true
      - id: walks
        run: make walks WALKSHARD=${{ matrix.shard }} WALKTIMEOUT=8m
      # The trace of every walk that failed, see Finding why a walk failed
      # in docs/TESTING.md.
      - if: failure() && steps.walks.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walk-traces-${{ strategy.job-index }}
          path: .build/walk-traces
          retention-days: 14
          if-no-files-found: ignore
      - if: github.ref == 'refs/heads/main' && steps.walks.outcome == 'success' && strategy.job-index == 0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v2-walks-${{ runner.os }}-${{ github.sha }}

  # Every fuzz target for 10000 executions. Go keeps the inputs that
  # reached new code in its build cache, which main and the nightly
  # fuzzing save, so a run goes on from where the last one stopped. The
  # licence dispenser's simulation is fuzzed at night only, SIMTIME=0.
  fuzz:
    needs: [changes, image]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          key: fuzz-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: fuzz-v2-${{ runner.os }}-
          node: node
      - id: fuzz
        run: make fuzz SIMTIME=0
      - if: github.ref == 'refs/heads/main' && !cancelled() && steps.fuzz.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: fuzz-v2-${{ runner.os }}-${{ github.sha }}

  # The Go tests on Tim's platform, against the ffmpeg we ship, which
  # encodes through VideoToolbox as a customer's does. make unit on a Mac
  # leaves out the race detector and the licence server, see the Makefile.
  macos:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          key: go-v1-macos-${{ runner.os }}-${{ github.sha }}
          restore-keys: go-v1-macos-${{ runner.os }}-
          ffmpeg: true
      - id: tests
        run: make unit
      - if: github.ref == 'refs/heads/main' && !cancelled() && steps.tests.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-v1-macos-${{ runner.os }}-${{ github.sha }}

  # The app built on a Mac with no warning allowed, WERROR=1, and then
  # opened from outside it: a link in the letter a buyer gets, handed to
  # macOS with the app closed and with it open, with the local dispenser
  # beside it. See From outside the app in docs/TESTING.md. Its cache is
  # the one builds.yml starts from too, since both build the app with the
  # same flags, WERROR=1 among them.
  outside:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          key: go-v1-app-${{ runner.os }}-${{ github.sha }}
          restore-keys: go-v1-app-${{ runner.os }}-
          node: npm
          ffmpeg: true
          llama: true
      # Unlock writes the key to the default keychain. A locked one puts a
      # box on screen that nobody here can answer, so this one is made
      # unlocked, never locks again and becomes the default.
      - name: A keychain of its own
        run: |
          kc="$RUNNER_TEMP/outside.keychain-db"
          security create-keychain -p outside "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p outside "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$kc"
      - id: outside
        run: make outside WERROR=1
      - if: github.ref == 'refs/heads/main' && !cancelled() && steps.outside.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-v1-app-${{ runner.os }}-${{ github.sha }}
