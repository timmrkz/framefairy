# Runs on every pull request and on every push to main.
#
# The work is split across machines that run at the same time, because none
# of it needs any of the rest: the interface type check does not care whether
# the fuzzing found anything, and the fuzzing does not care whether the app
# links on macOS. Run one after another they take about six minutes, and the
# answer arrives when the slowest one does instead.
#
# On a pull request each job then asks scripts/ci-needs.sh whether there is
# anything for it to do, so a change to the docs does not fuzz two platforms
# and a change to the interface does not run the Go tests. The rules live in
# that script rather than in here, and they err towards running: a test that
# runs when it need not costs a minute, one that does not run when it should
# have costs a broken main.
#
# Every job still runs and still reports, it just does nothing when there is
# nothing to do. That keeps the checks a branch rule can be built on, which
# a job skipped outright would not.
#
# A push to main narrows nothing. Whatever it touched, everything is built
# and tested, so main is always known to be sound and a mistake in the rules
# can never be what hides a break.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push makes the first answer worthless, so it is stopped rather
# than left to finish. It frees the runners for the push that replaced it.
# Never on main, where every commit's result is worth having on its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # First back, by a long way, and the one most changes touch. It needs Node
  # and nothing else: no Go, no system libraries, no build.
  interface:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: needs
        run: sh scripts/ci-needs.sh interface >> "$GITHUB_OUTPUT"
      - if: steps.needs.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type check and interface tests
        if: steps.needs.outputs.run == 'true'
        run: make interface

  # Builds everything, the interface included, which is what proves the
  # programs still link and that Go can embed what make built.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # Always, whatever changed. A mistake in the rules that decide what
      # runs is silent: CI goes green having run less than it should. This
      # takes a second and it is the one thing nothing else would catch.
      - name: Check the CI rules
        run: sh scripts/ci-needs-test.sh
      - id: needs
        run: sh scripts/ci-needs.sh build >> "$GITHUB_OUTPUT"
      - if: steps.needs.outputs.run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - if: steps.needs.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: System packages
        if: steps.needs.outputs.run == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            ffmpeg patchelf pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev
      - name: Build
        if: steps.needs.outputs.run == 'true'
        run: make

  # Every Go test under the race detector, which also runs the seed corpus
  # of every fuzz target. ffmpeg is here because the tests that render skip
  # without it, and they are worth having.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: needs
        run: sh scripts/ci-needs.sh go >> "$GITHUB_OUTPUT"
      - if: steps.needs.outputs.run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: System packages
        if: steps.needs.outputs.run == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            ffmpeg patchelf pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev
      - name: Go tests
        if: steps.needs.outputs.run == 'true'
        run: make unit

  # Looking for new crashers, which is the part that does not need to hold
  # anything else up.
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: needs
        run: sh scripts/ci-needs.sh go >> "$GITHUB_OUTPUT"
      - if: steps.needs.outputs.run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: System packages
        if: steps.needs.outputs.run == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            ffmpeg patchelf pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev
      - name: Fuzz
        if: steps.needs.outputs.run == 'true'
        run: make fuzz

  # Tim's platform, so the build has to be clean and the tests have to pass
  # here too. A warning from clang or the linker fails it.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: needs
        run: sh scripts/ci-needs.sh build >> "$GITHUB_OUTPUT"
      - id: needsgo
        run: sh scripts/ci-needs.sh go >> "$GITHUB_OUTPUT"
      - if: steps.needs.outputs.run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - if: steps.needs.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build without warnings
        if: steps.needs.outputs.run == 'true'
        run: |
          make 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -iE "warning|deprecated" build.log; then
            echo "The build printed warnings, see above."
            exit 1
          fi
      - name: Go tests
        if: steps.needsgo.outputs.run == 'true'
        run: make unit

  # Fuzzing on macOS as well, because two of the targets are about paths and
  # a case-insensitive filesystem is a different thing to explore. It is its
  # own machine, so keeping it costs waiting time rather than nothing, and
  # nothing is what it costs: the job above is the slower of the two.
  macos-fuzz:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: needs
        run: sh scripts/ci-needs.sh go >> "$GITHUB_OUTPUT"
      - if: steps.needs.outputs.run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz
        if: steps.needs.outputs.run == 'true'
        run: make fuzz
