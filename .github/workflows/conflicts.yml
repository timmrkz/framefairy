# A pull request that no longer merges into main is told so in a comment
# that names the files in conflict, once for each commit of it. GitHub
# sends no event when a pull request starts to conflict, and runs no CI
# on one, so without the comment nothing wakes the session that owns it.
# After a push to main every open pull request is tried, and when a pull
# request is opened or pushed to, that one, since it may conflict from
# the start. git merge-tree merges in memory, without a checkout of
# either side, and no code of the pull request runs. A pull request from
# a fork is left alone. It hears a pull request through
# pull_request_target, because GitHub runs no pull_request workflow on one
# that conflicts. GitHub blocks that event in a public repository unless
# the repository's Actions policy allows it for this file, from 2 December
# 2026 and in brownouts before, see When main moves in docs/WORKFLOW.md. The comment says what is so and asks nothing: a
# session reads it as news and checks on GitHub itself, see When main
# moves in docs/WORKFLOW.md.
name: Conflicts

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

# A newer main says all there is to say, and so does a newer push to a
# pull request. The hidden mark in each comment keeps a run that was
# stopped halfway from telling a pull request twice.
concurrency:
  group: conflicts-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  tell:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          gh pr list --base main --state open --limit 100 --json number,headRefOid,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefOid)"' |
          while read -r n head; do
            [ -z "$ONLY" ] || [ "$n" = "$ONLY" ] || continue
            mark="<!-- conflicts $head -->"
            git fetch -q origin "pull/$n/head" || { echo "::warning::#$n: could not fetch it"; continue; }
            out=$(git merge-tree --write-tree --name-only --no-messages HEAD "$head") && continue
            # 1 and a tree is a conflict, anything else git could not try.
            [ $? -eq 1 ] && [[ ${out%%$'\n'*} =~ ^[0-9a-f]{40,64}$ ]] ||
              { echo "::warning::#$n: git merge-tree could not merge it: $out"; continue; }
            said=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$n/comments" --jq '.[].body') ||
              { echo "::warning::#$n: could not read its comments"; continue; }
            case $said in *"$mark"*) continue ;; esac
            files=$(printf '%s\n' "$out" | tail -n +2 | sed 's/.*/- `&`/')
            gh pr comment "$n" --body "This pull request at $(git rev-parse --short "$head") no longer merges into main at $(git rev-parse --short HEAD). These files conflict:

          $files

          $mark" || echo "::warning::#$n: could not comment"
          done
