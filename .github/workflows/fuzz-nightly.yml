# The long fuzzing, once a night on main, so a pull request does not wait
# for it. See Fuzzing in docs/BUILD.md.
#
# A pull request fuzzes every target for 10000 executions, in the job fuzz
# of ci.yml. That is enough to catch a change that breaks a reader, not
# enough to find what nobody thought of. This finds that: half a minute on
# every target, new histories for the licence dispenser's simulation, and
# the two targets about paths on a Mac, whose disk takes names in either
# case and has /var as a link.
#
# Go keeps the inputs that reached new code in its build cache, and that is
# kept here between nights and shared with CI, so every night goes on from
# where the last one stopped and every pull request starts from there.
#
# A crash fails the run, and the input that crashed is left as an artifact
# called crashers. Put it in the target's testdata/fuzz/ folder in a pull
# request with the fix: from then on every go test plays it.
name: Nightly fuzzing

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yml

  # In the CI image, as the job fuzz of ci.yml is, whose cache this shares.
  # One of the targets is in the app's package, so the fuzzing compiles
  # it, and that needs GTK and WebKit, which the image has. Without them
  # make stopped before fuzzing anything, every night.
  linux:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash -e {0}
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init
      volumes:
        - /home/runner/work:/home/runner/work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The checkout is the runner's user's and the job runs as root, see
      # the walks in ci.yml.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: fuzz-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: fuzz-v2-${{ runner.os }}-
      # 600 histories of 400 steps, about a minute on one core while the
      # others fuzz the rest.
      - name: Fuzz
        run: make fuzz FUZZTIME=30s SIMTIME=600x
      # Go writes an input that crashed into the target's testdata/fuzz/,
      # where git sees it as new.
      - name: What crashed
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/crashers"
          git ls-files --others --exclude-standard -- '*testdata/fuzz/*' | tee /dev/stderr |
            while read -r f; do mkdir -p "$RUNNER_TEMP/crashers/$(dirname "$f")" && cp "$f" "$RUNNER_TEMP/crashers/$f"; done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crashers
          path: ${{ runner.temp }}/crashers
          retention-days: 30
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: fuzz-v2-${{ runner.os }}-nightly-${{ github.run_id }}

  # The two targets about paths, on the disk a customer has.
  macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: fuzz-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: fuzz-v1-${{ runner.os }}-
      - name: Fuzz the targets about paths
        run: make fuzz FUZZTIME=2m FUZZTARGETS='FuzzSafeChild FuzzKnownStaysInTheLibrary'
      - name: What crashed
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/crashers"
          git ls-files --others --exclude-standard -- '*testdata/fuzz/*' | tee /dev/stderr |
            while read -r f; do mkdir -p "$RUNNER_TEMP/crashers/$(dirname "$f")" && cp "$f" "$RUNNER_TEMP/crashers/$f"; done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crashers-macos
          path: ${{ runner.temp }}/crashers
          retention-days: 30
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: fuzz-v1-${{ runner.os }}-nightly-${{ github.run_id }}
