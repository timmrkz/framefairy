# Builds the app for every push to main and to a pull request, signs it with
# the update key and publishes it where the app looks for a newer build of
# itself. See docs/UPDATES.md.
#
# A push to a pull request is built on the push, not on the pull request's
# synchronize. GitHub runs no pull_request workflow while a pull request is
# in conflict with main, and a commit pushed to #35 in that state got no
# build: the Updates page went on offering the one before as the newest.
# GitHub runs push whatever the conflict, so every push to a branch of this
# repository comes here, finds the branch's open pull request and builds
# its channel. A branch with no open pull request builds nothing. The
# pull_request event is left with what only it says: opened, reopened and
# closed. The build is of the branch as it is, not merged with main, so a
# conflict does not make it wrong to test.
#
# A commit that is built already, or that only changes the docs against
# the build there is, gets no build of its own. scripts/needs-build.sh
# decides that for the build and for the list alike, so a pull request
# opened after its branch was pushed is not built twice.
#
# A channel is main or one pull request. Everything lives in one release of
# this repository called dev, marked a pre-release so it is never taken for
# the latest one:
#
#   app-<channel>-<version>.zip   a channel's build, the app and nothing else
#   channel-<channel>.json        its entry: version, commit, where the zip
#                                 is, its checksum and its signature
#   channels.json                 every entry in one file, which is the one
#                                 file the app reads
#
# Five jobs, because they need different kinds of care:
#
# 0. which, what a push or a pull request is a build of: main, the open pull
#    request of the branch pushed, or nothing.
# 1. build, on macOS, per channel. A second push to a pull request stops the
#    build of the first, whose result nobody wants any more.
# 2. publish, per channel, one after another and never stopped half way,
#    uploads the zip and the entry, or takes the entry away when a pull
#    request is merged or closed.
# 3. list, for all channels at once, writes channels.json again from every
#    entry. Two of them never run together, and one that is waiting is
#    replaced by the next, which is safe, because each writes the list from
#    what is there when it runs. It also takes away the entry of any pull
#    request that is not open any more, which the close did not take away
#    itself, see below. Beside each pull request's build it writes the
#    newest commit of the pull request when that is not the one built and
#    has a build to come, so the Updates page says the build it offers is
#    not the newest.
# 4. announce, the same list written at once when a push starts, beside the
#    build. Without it the list only learned of a push when its build was
#    done, so for the whole of the build the page offered the build before
#    as the newest.
#
# Only branches of this repository are built. A build runs whatever the
# pull request holds, and one from a fork gets no secrets anyway. Until the
# key is made, nothing is published and the build says why.
name: Builds to update to

on:
  pull_request:
    types: [opened, reopened, closed]
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  which:
    # A branch deleted is a push too, of nothing.
    if: >-
      (github.event_name == 'push' && !github.event.deleted) ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      channel: ${{ steps.which.outputs.channel }}
      number: ${{ steps.which.outputs.number }}
      title: ${{ steps.which.outputs.title }}
      sha: ${{ steps.which.outputs.sha }}
      build: ${{ steps.which.outputs.build }}
    steps:
      - id: which
        name: What this is a build of
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BRANCH: ${{ github.ref_name }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # A branch's pull request is only one opened from this repository:
        # a fork can have a branch of the same name.
        run: |
          build=true
          if [ "$EVENT" = pull_request ]; then
            if [ "$ACTION" = closed ]; then build=false; fi
          elif [ "$BRANCH" = main ]; then
            NUMBER=
          else
            found=$(gh pr list --head "$BRANCH" --state open --json number,title,isCrossRepository \
              --jq '[.[] | select(.isCrossRepository | not)][0] // empty')
            if [ -z "$found" ]; then
              echo "::notice::$BRANCH has no open pull request, so it has no channel to build for."
              exit 0
            fi
            NUMBER=$(printf '%s' "$found" | jq -r .number)
            TITLE=$(printf '%s' "$found" | jq -r .title)
          fi
          if [ -n "$NUMBER" ]; then channel="pr-$NUMBER"; else channel=main; fi
          {
            echo "channel=$channel"
            echo "number=$NUMBER"
            echo "sha=$SHA"
            echo "build=$build"
            # A title can hold anything, so it goes in a block of its own,
            # ended by a word no title holds.
            end="END_$(openssl rand -hex 12)"
            echo "title<<$end"
            printf '%s\n' "$TITLE" | tr -d '\r' | head -n 1
            echo "$end"
          } >> "$GITHUB_OUTPUT"
          echo "$SHA is a build of $channel"

  build:
    needs: which
    if: needs.which.outputs.build == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    concurrency:
      group: builds-build-${{ needs.which.outputs.channel }}
      cancel-in-progress: true
    outputs:
      built: ${{ steps.zip.outputs.built }}
      channel: ${{ steps.what.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The branch as it is, not merged with main: the build Tim tests is
          # the pull request's own.
          ref: ${{ needs.which.outputs.sha }}

      - id: key
        name: Is there an update key
        env:
          KEY: ${{ secrets.FRAMEFAIRY_UPDATE_KEY }}
        run: |
          if [ -z "$KEY" ] || [ ! -s cmd/framefairy-app/update-key.txt ]; then
            echo "::notice::No update key yet, so nothing is built to update to. See docs/UPDATES.md, The keys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # A pull request's commit that is built already, or that only changes
      # the docs against the build there is, gets no build of its own, and
      # Tim no restart for nothing. It is measured against the build and
      # not against the push before: a push of the docs that stopped the
      # build of a push of code left that code with no build at all. main
      # is always built.
      - id: needs
        if: steps.key.outputs.ready == 'true'
        name: Does this commit need a build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ needs.which.outputs.channel }}
          SHA: ${{ needs.which.outputs.sha }}
        run: |
          run=true
          if [ "$CHANNEL" != main ]; then
            built=""
            if gh release download dev --pattern "channel-$CHANNEL.json" --dir built 2>/dev/null; then
              built=$(jq -r '.commit // empty' "built/channel-$CHANNEL.json")
            fi
            rm -rf built
            case $(sh scripts/needs-build.sh "$built" "$SHA") in
            built)
              echo "::notice::$SHA is built already."
              run=false
              ;;
            docs)
              echo "::notice::Only the docs changed against the build there is, so this commit has no build of its own."
              run=false
              ;;
            esac
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - id: what
        if: steps.needs.outputs.run == 'true'
        name: What this build is
        env:
          NUMBER: ${{ needs.which.outputs.number }}
          TITLE: ${{ needs.which.outputs.title }}
          SHA: ${{ needs.which.outputs.sha }}
        # A build is named by the commit it was made from, the way git and
        # GitHub shorten it, so its version says what is in it. Nothing
        # orders builds by their version: the app installs whatever build
        # its channel has when it is not the one running, and the list
        # keeps a channel's newest by when it was published.
        run: |
          engine=$(awk -F'"' '/^const Version = /{ print $2; exit }' engine/log.go)
          short=$(echo "$SHA" | cut -c1-7)
          if [ -n "$NUMBER" ]; then
            channel="pr-$NUMBER"
            name="#$NUMBER $TITLE"
            version="$engine-pr$NUMBER.$short"
          else
            channel=main
            name=main
            version="$engine-main.$short"
          fi
          {
            echo "channel=$channel"
            echo "version=$version"
            echo "commit=$(echo "$SHA" | cut -c1-12)"
            echo "zip=app-$channel-$version.zip"
          } >> "$GITHUB_OUTPUT"
          # The name can hold anything a title can, so it goes by file.
          mkdir -p dist
          printf '%s' "$name" > dist/name.txt

      - if: steps.needs.outputs.run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - if: steps.needs.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The two programs we ship beside the app, built by the same scripts
      # as a release and kept until those change. The ffmpeg cache is the
      # one CI keeps, so it is usually there already.
      - id: ffmpeg
        if: steps.needs.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: .build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - id: llama
        if: steps.needs.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: .build/llama
          key: llama-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-llama.sh') }}
      - name: What building them needs
        if: steps.needs.outputs.run == 'true' && (steps.ffmpeg.outputs.cache-hit != 'true' || steps.llama.outputs.cache-hit != 'true')
        run: brew install meson ninja pkg-config nasm cmake
      - name: The ffmpeg we ship
        if: steps.needs.outputs.run == 'true' && steps.ffmpeg.outputs.cache-hit != 'true'
        run: sh scripts/build-ffmpeg.sh .build/ffmpeg
      - name: The llama-server we ship
        if: steps.needs.outputs.run == 'true' && steps.llama.outputs.cache-hit != 'true'
        run: sh scripts/build-llama.sh .build/llama

      - name: The app
        if: steps.needs.outputs.run == 'true'
        run: >-
          make app
          BUILD_VERSION='${{ steps.what.outputs.version }}'
          BUILD_CHANNEL='${{ steps.what.outputs.channel }}'
          BUILD_COMMIT='${{ steps.what.outputs.commit }}'

      # One entry at the top, Frame Fairy.app, which is what Wails' updater
      # asks of a zip. --norsrc, because ditto otherwise adds a ._ file
      # beside every file for its extended attributes, and the updater
      # would unpack them into the bundle. The signatures are inside the
      # programs, not in attributes, so nothing is lost.
      - id: zip
        if: steps.needs.outputs.run == 'true'
        name: Pack it and sign it
        env:
          FRAMEFAIRY_UPDATE_KEY: ${{ secrets.FRAMEFAIRY_UPDATE_KEY }}
          ZIP: ${{ steps.what.outputs.zip }}
          CHANNEL: ${{ steps.what.outputs.channel }}
          VERSION: ${{ steps.what.outputs.version }}
          COMMIT: ${{ steps.what.outputs.commit }}
          REPO: ${{ github.repository }}
        run: |
          ditto -c -k --norsrc --keepParent "bin/Frame Fairy.app" "dist/$ZIP"
          go run ./cmd/framefairy-release sign \
            -zip "dist/$ZIP" -channel "$CHANNEL" -name "$(cat dist/name.txt)" \
            -version "$VERSION" -commit "$COMMIT" \
            -url "https://github.com/$REPO/releases/download/dev/$ZIP" \
            -out "dist/channel-$CHANNEL.json"
          rm dist/name.txt
          ls -l dist
          echo "built=true" >> "$GITHUB_OUTPUT"

      - if: steps.zip.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [which, build]
    # always(), so it also runs when build was skipped because the pull
    # request closed.
    if: >-
      always() && needs.which.result == 'success' &&
      (github.event.action == 'closed' || needs.build.outputs.built == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: builds-publish-${{ needs.which.outputs.channel }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: The release the builds live in
        run: |
          gh release view dev >/dev/null 2>&1 ||
            gh release create dev --prerelease --latest=false --target main \
              --title "Builds to update to" \
              --notes "The builds of main and of each open pull request, for the app to update itself to while it is being made. Not for customers. See docs/UPDATES.md." ||
            gh release view dev >/dev/null

      - if: github.event.action != 'closed'
        uses: actions/download-artifact@v8
        with:
          name: build
          path: dist

      - name: Upload the build and its entry
        if: github.event.action != 'closed'
        run: gh release upload dev dist/* --clobber

      - name: Take the pull request's entry away
        if: github.event.action == 'closed'
        env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: gh release delete-asset dev "channel-pr-$NUMBER.json" -y || true

  list:
    needs: publish
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: builds-list
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The same commit the build came from, so a pull request that changes
      # the tool is listed by its own tool. Only branches of this repository
      # get this far.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Write the channel list from every entry
        run: sh scripts/channel-list.sh

      # A zip no entry points at is gone an hour after it was made. Not at
      # once: a publish that runs beside this job may have uploaded a zip
      # whose entry this job has not seen yet.
      - name: Remove builds nobody can reach any more
        run: |
          jq -r '.channels[].url | split("/") | last' channels.json > kept.txt
          now=$(date -u +%s)
          gh release view dev --json assets \
            --jq '.assets[] | select(.name | test("^app-.*\\.zip$")) | "\(.name) \(.createdAt)"' |
          while read -r name created; do
            grep -qxF "$name" kept.txt && continue
            age=$(( now - $(date -u -d "$created" +%s) ))
            if [ "$age" -gt 3600 ]; then
              echo "removing $name"
              gh release delete-asset dev "$name" -y || true
            fi
          done

  # The list written the moment a push to a pull request starts, beside its
  # build, so the Updates page says for the whole of the build that the
  # build it offers is not the newest. The list job writes it again when
  # the build is done. The two share one queue, and each writes the list
  # from what is there when it runs, so the order they run in does not
  # matter.
  announce:
    needs: which
    if: needs.which.outputs.build == 'true' && needs.which.outputs.channel != 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: builds-list
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.which.outputs.sha }}
      # Nothing is published until the key is made, and a list without it
      # cannot be checked.
      - id: key
        name: Is there an update key
        run: |
          if [ -s cmd/framefairy-app/update-key.txt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No update key yet, so there is no list to write."
          fi
      - if: steps.key.outputs.ready == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - if: steps.key.outputs.ready == 'true'
        name: Write the channel list from every entry
        run: sh scripts/channel-list.sh
