# Builds the app for every push to main and to a pull request. Signing it
# with the update key and publishing it where the app looks for a newer
# build of itself is publish.yml's work, not this one's. See
# docs/UPDATES.md.
#
# This workflow runs the branch's own code, so main's copy of it asks for
# no secret and no token that can write. That is how this copy is
# written, not a wall: a push to a branch runs the workflow file of that
# branch, and a branch's copy can ask for a token that writes. What holds
# the update key away from a branch is the environment updates, limited
# to main, which no branch's workflow can enter. publish.yml runs from
# main whenever this workflow starts or ends, takes the zip this one
# leaves as an artifact, and signs and publishes it with main's own tools.
# The zip is the only thing it takes from here: which channel, which
# commit and which version it works out again from GitHub's own record of
# the run, and it signs only a commit that main's history, or the pull
# request's, holds.
#
# A push to a pull request is built on the push, not on the pull request's
# synchronize. GitHub runs no pull_request workflow while a pull request is
# in conflict with main, and a commit pushed to #35 in that state got no
# build: the Updates page went on offering the one before as the newest.
# GitHub runs push whatever the conflict, so every push to a branch of this
# repository comes here, finds the branch's open pull request and builds
# its channel. A branch with no open pull request builds nothing.
#
# Only a push builds. Opening a pull request builds nothing, so a pull
# request is built from its first push after it was opened. Dependabot
# pushes its branch and opens its pull request in the same second, and
# when the opening built too, the push and the opening each built the one
# commit and the second stopped the first, which left a cancelled check on
# every update it opened, #642. The first push of a session's branch comes
# before its pull request and holds nothing worth testing in the app, Tim
# said. The pull_request event is left with the close, which builds
# nothing and only has publish.yml write the list again without it. The
# build is of the branch as it is, not merged with main, so a conflict
# does not make it wrong to test.
#
# A commit that is built already, or that only changes the docs against
# the build there is, gets no build of its own. needsBuild in
# cmd/framefairy-release decides that for the build and for the list
# alike.
#
# Two jobs:
#
# 0. which, on Linux, what a push is a build of, main, the open pull
#    request of the branch pushed, or nothing, and whether it needs a
#    build, so a Mac is only started for one that does. See buildPlan in
#    cmd/framefairy-release/plan.go.
# 1. build, on macOS, per channel. A second push to a pull request stops the
#    build of the first, whose result nobody wants any more. It leaves the
#    zip as an artifact called build, and nothing else. Then it opens the
#    same app from outside, make outside, which ci.yml ran on a Mac of
#    its own before, see the decision record
#    docs/decisions/2026-11-20-one-mac-app-build-per-push.md. The run ends
#    after it, so a build whose checks from outside fail is not published.
#
# Only branches of this repository are built. A build runs whatever the
# pull request holds, and one from a fork gets no secrets anyway. Until the
# key is made, nothing is built and the build says why.
name: Builds to update to

on:
  pull_request:
    types: [closed]
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  which:
    # A branch deleted is a push too, of nothing. A pull request that
    # closes runs this job and nothing in it, so publish.yml hears that the
    # run ended and writes the list without it.
    if: >-
      (github.event_name == 'push' && !github.event.deleted) ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.which.outputs.build }}
      channel: ${{ steps.which.outputs.channel }}
      sha: ${{ steps.which.outputs.sha }}
      version: ${{ steps.which.outputs.version }}
      commit: ${{ steps.which.outputs.commit }}
    steps:
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: github.event_name == 'push'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - id: which
        if: github.event_name == 'push'
        name: What this is a build of
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: go run ./cmd/framefairy-release build-plan -event push -branch "$BRANCH" -commit "$GITHUB_SHA"

  build:
    needs: which
    if: needs.which.outputs.build == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    concurrency:
      group: builds-build-${{ needs.which.outputs.channel }}
      cancel-in-progress: true
    # The checks from outside end a test whose signal never comes after
    # this, and print every goroutine, see make outside.
    env:
      OUTSIDETIMEOUT: 2m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch as it is, not merged with main: the build Tim tests is
          # the pull request's own.
          ref: ${{ needs.which.outputs.sha }}

      # Go, Node, the two programs we ship beside the app, and Go's build
      # cache, the one this job saves on main after every push, once the
      # checks from outside passed.
      # setup-go keys its cache by go.sum alone and saves it only when
      # go.sum changes, so the build started from one days old and
      # compiled ever more again: make app went from 58 s to 113 s in the
      # five days after go.sum last changed, #408. The ffmpeg cache is the
      # one CI keeps, so it is usually there already.
      - id: prepare
        uses: ./.github/actions/prepare
        with:
          key: go-v2-app-${{ runner.os }}-${{ needs.which.outputs.sha }}
          restore-keys: go-v2-app-${{ runner.os }}-
          node: npm
          ffmpeg: true
          llama: true

      - name: The app
        run: >-
          make app WERROR=1
          BUILD_VERSION='${{ needs.which.outputs.version }}'
          BUILD_CHANNEL='${{ needs.which.outputs.channel }}'
          BUILD_COMMIT='${{ needs.which.outputs.commit }}'

      # One entry at the top, Frame Fairy.app, which is what Wails' updater
      # asks of a zip. --norsrc, because ditto otherwise adds a ._ file
      # beside every file for its extended attributes, and the updater
      # would unpack them into the bundle. The signatures are inside the
      # programs, not in attributes, so nothing is lost. The zip is named
      # and signed by publish.yml.
      - id: zip
        name: Pack it
        run: mkdir -p dist && ditto -c -k --norsrc --keepParent "bin/Frame Fairy.app" dist/app.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: dist/app.zip
          # The app is zipped already, by ditto above.
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

      # The same app opened from outside it: a link in the letter a buyer
      # gets, handed to macOS with the app closed and with it open, with
      # the local dispenser beside it, see From outside the app in
      # docs/TESTING.md. After the zip is uploaded, so they never change
      # what it holds. Unlock writes the key to the default keychain. A
      # locked one puts a box on screen that nobody here can answer, so
      # this one is made unlocked, never locks again and becomes the
      # default.
      - name: A keychain of its own
        run: |
          kc="$RUNNER_TEMP/outside.keychain-db"
          security create-keychain -p outside "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p outside "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$kc"

      # The same version, channel and commit as the app above, so make all
      # finds every program built and builds only the app with the probe.
      - id: outside
        name: The app opened from outside
        run: >-
          make outside WERROR=1
          BUILD_VERSION='${{ needs.which.outputs.version }}'
          BUILD_CHANNEL='${{ needs.which.outputs.channel }}'
          BUILD_COMMIT='${{ needs.which.outputs.commit }}'

      # Saved on main once everything passed, and on a branch only when
      # none was found, so the next build starts warm. After the zip, so
      # no upload sits between a push and its build on the Updates page.
      - if: steps.outside.outcome == 'success'
        uses: ./.github/actions/save
        with:
          key: go-v2-app-${{ runner.os }}-${{ needs.which.outputs.sha }}
          save: ${{ needs.which.outputs.channel == 'main' || steps.prepare.outputs.matched-key == '' }}
