# Every sequence walked with the app's motion, once a night on main, so a
# pull request does not wait for it. See Where they run in
# docs/TESTING.md.
#
# The same night, every test counts the lines it runs, the Go tests, the
# interface's tests and the walks, and the counts go to Codecov, which
# keeps them as one report of all the code and its history from night to
# night. Only here: counting makes a test slower and an upload can fail,
# so no pull request does either. See Coverage in docs/TESTING.md.
#
# The walks in ci.yml walk a sequence asking for less motion unless one of
# its steps looks at how the app moves, the steps named in moving in
# frontend/preview/walks/common/steps.mjs. A new step that looks at motion and
# is not named there passes without ever seeing what it checks. Walked with
# the motion it does see it, so a step left out of moving fails here.
name: Nightly walks with motion, and coverage

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yml

  # The same as the walks in ci.yml, with STILL=none.
  walks:
    needs: image
    name: walks
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash -e {0}
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --init --ipc=host
      volumes:
        - /home/runner/work:/home/runner/work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The checkout is the runner's user's and the job runs as root, see
      # the walks in ci.yml.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v2-walks-${{ runner.os }}-${{ github.sha }}
          restore-keys: go-v2-walks-${{ runner.os }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: ffmpeg
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: The ffmpeg we ship
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: sh scripts/build-ffmpeg.sh .build/ffmpeg
      - name: The episode's decoder
        run: make frames
      # The videos the walks in ci.yml kept for this share, only read.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/walk-videos
          key: walk-videos-${{ strategy.job-index }}-${{ needs.image.outputs.ref }}-${{ hashFiles('cmd/framefairy-app/walkvideos_test.go') }}-
          restore-keys: walk-videos-${{ strategy.job-index }}-${{ needs.image.outputs.ref }}-${{ hashFiles('cmd/framefairy-app/walkvideos_test.go') }}-
      - name: Sequences and walks with motion
        run: |
          make walks STILL=none WALKSHARD=${{ matrix.shard }} WALKTIMEOUT=12m COVERAGE=.build/coverage 2>&1 | tee walks.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then sh scripts/test-failures.sh walks.log; fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-walks-${{ strategy.job-index }}
          path: |
            .build/coverage/*-go.txt
            .build/coverage/*.lcov
          if-no-files-found: error
          # They lie under .build, which upload-artifact counts as hidden.
          include-hidden-files: true

  # The Go tests, counting the lines they run, in three shares like the
  # job linux in ci.yml, without the race detector, which the counts do
  # not need and which makes the tests slower.
  unit:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash -e {0}
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --init
      volumes:
        - /home/runner/work:/home/runner/work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The checkout is the runner's user's and the job runs as root, see
      # the walks in ci.yml.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # make checks for npm before it builds anything, see ci.yml.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # A build that counts lines is a build of its own, so it has a cache
      # of its own, kept from one night to the next.
      - id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v3-coverage-${{ runner.os }}-${{ strategy.job-index }}-${{ github.sha }}
          restore-keys: go-v3-coverage-${{ runner.os }}-${{ strategy.job-index }}-
      - id: ffmpeg
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: The ffmpeg we ship
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: sh scripts/build-ffmpeg.sh .build/ffmpeg
      - name: The episode's decoder
        run: make frames
      - name: Go tests counting their lines
        id: tests
        run: |
          make unit UNITSHARD=${{ matrix.shard }} RACE= UNITTIMEOUT=4m COVERAGE=.build/coverage 2>&1 | tee unit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then sh scripts/test-failures.sh unit.log; fi
          exit "$status"
      - if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v3-coverage-${{ runner.os }}-${{ strategy.job-index }}-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit-${{ strategy.job-index }}
          path: .build/coverage/go-unit-*.txt
          if-no-files-found: error
          include-hidden-files: true

  # The interface's own tests, counting the lines they run.
  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Interface tests counting their lines
        run: make interface COVERAGE=.build/coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-interface
          path: .build/coverage/interface-unit/lcov.info
          if-no-files-found: error
          include-hidden-files: true

  # The counts to Codecov, see .github/codecov.yml, signed in with
  # GitHub's own OIDC token, so no Codecov token is kept anywhere. A kind
  # of test whose run failed sends nothing that night, since what it
  # counted is only part of what it reaches, and Codecov carries its last
  # counts forward instead.
  codecov:
    needs: [walks, unit, interface]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
      - if: needs.unit.result == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          disable_search: true
          fail_ci_if_error: true
          flags: go-tests
          files: coverage/go-unit-1-of-3.txt,coverage/go-unit-2-of-3.txt,coverage/go-unit-3-of-3.txt
      - if: needs.interface.result == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          disable_search: true
          fail_ci_if_error: true
          flags: interface-tests
          files: coverage/lcov.info
      - if: needs.walks.result == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          disable_search: true
          fail_ci_if_error: true
          flags: walks
          files: coverage/walks-1-of-4-go.txt,coverage/walks-2-of-4-go.txt,coverage/walks-3-of-4-go.txt,coverage/walks-4-of-4-go.txt,coverage/walks-1-of-4-interface.lcov,coverage/walks-2-of-4-interface.lcov,coverage/walks-3-of-4-interface.lcov,coverage/walks-4-of-4-interface.lcov
