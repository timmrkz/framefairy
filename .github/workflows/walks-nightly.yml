# Every sequence walked with the app's motion, once a night on main, so a
# pull request does not wait for it. See Where they run in
# docs/TESTING.md.
#
# The same night, every test counts the lines it runs, the Go tests, the
# interface's tests and the walks, and the counts go to Codecov, which
# keeps them as one report of the code and its history from night to
# night. Only here: counting makes a test slower and an upload can fail,
# so no pull request does either. It all runs on Linux, so the files
# built only for the Mac are not in it. See Coverage in docs/TESTING.md.
#
# The walks in ci.yml walk a sequence asking for less motion unless one of
# its steps looks at how the app moves, the steps named in moving in
# frontend/preview/walks/common/steps.mjs. A new step that looks at motion and
# is not named there passes without ever seeing what it checks. Walked with
# the motion it does see it, so a step left out of moving fails here.
#
# They walk in both browsers, on four machines each. The walks in ci.yml
# walk in Chromium, the engine the app runs in on Windows, and here they
# walk in WebKit too, the engine of the Mac, so both are walked every day.
# Only Chromium counts the lines of the interface, so the walks in
# Chromium are the ones that count. See Two browsers in docs/TESTING.md.
name: Nightly walks with motion, and coverage

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yml

  # The same as the walks in ci.yml, with STILL=none, in Chromium
  # counting lines. The walks in WebKit below take the same steps.
  walks:
    needs: image
    name: walks (${{ matrix.browser }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
        shard: [1/4, 2/4, 3/4, 4/4]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: &walks-container
      image: ${{ needs.image.outputs.walks }}
      options: --init --ipc=host
      volumes:
        - /home/runner/work:/home/runner/work
    steps: &walks-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The walks in Chromium build with coverage, which is a build of its
      # own, so they keep a cache of their own beside the one ci.yml keeps
      # for the walks, and take that one when theirs is not there yet.
      # Saved once for each go.sum, so a night adds no cache of its own to
      # the ten gigabytes the repository may keep, and what changed since
      # is built again. The walks in WebKit build as ci.yml does and take
      # its cache.
      - id: prepare
        uses: ./.github/actions/prepare
        with:
          key: go-v3-walks-${{ matrix.browser == 'chromium' && 'coverage-' || '' }}${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-v3-walks-${{ matrix.browser == 'chromium' && 'coverage-' || '' }}${{ runner.os }}-
            go-v3-walks-${{ runner.os }}-
          node: npm
          ffmpeg: true
      - name: Sequences and walks with motion
        id: walks
        run: make walks STILL=none WALKBROWSER=${{ matrix.browser }} WALKSHARD=${{ matrix.shard }} WALKTIMEOUT=12m ${{ matrix.browser == 'chromium' && 'COVERAGE=.build/coverage' || '' }}
      # The traces of the walks that failed, threw or hung, the same as
      # the walks in ci.yml keep, see Finding why a walk failed in
      # docs/TESTING.md.
      - if: failure() && steps.walks.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walk-traces-${{ matrix.browser }}-${{ strategy.job-index }}
          path: .build/walk-traces
          retention-days: 14
          if-no-files-found: ignore
      # The shares in Chromium build the same, so one of them saves.
      - if: steps.walks.outcome == 'success' && steps.prepare.outputs.cache-hit != 'true' && matrix.browser == 'chromium' && matrix.shard == '1/4'
        uses: ./.github/actions/save
        with:
          key: go-v3-walks-coverage-${{ runner.os }}-${{ hashFiles('go.sum') }}
          save: true
      - if: matrix.browser == 'chromium'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-walks-${{ strategy.job-index }}
          path: |
            .build/coverage/*-go.txt
            .build/coverage/*.lcov
          if-no-files-found: error
          # They lie under .build, which upload-artifact counts as hidden.
          include-hidden-files: true

  # The same walks in WebKit, the steps above with YAML's anchors, in a
  # job of their own: Codecov takes the walks' counts only when every
  # share of the job that counted them passed, and a share failing in
  # WebKit says nothing about what Chromium counted.
  walks-webkit:
    needs: image
    name: walks (${{ matrix.browser }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit]
        shard: [1/4, 2/4, 3/4, 4/4]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: *walks-container
    steps: *walks-steps

  # The Go tests, counting the lines they run, in three shares like the
  # job linux in ci.yml, without the race detector, which the counts do
  # not need and which makes the tests slower.
  unit:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --init
      volumes:
        - /home/runner/work:/home/runner/work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A build that counts lines is a build of its own, so it has a cache
      # of its own, saved once for each go.sum, see the walks above, and
      # main's cache for the job linux until then.
      - id: prepare
        uses: ./.github/actions/prepare
        with:
          key: go-v4-coverage-${{ runner.os }}-${{ strategy.job-index }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-v4-coverage-${{ runner.os }}-${{ strategy.job-index }}-
            go-v4-linux-${{ runner.os }}-${{ strategy.job-index }}-
          node: node
          ffmpeg: true
      - name: Go tests counting their lines
        id: tests
        run: make unit UNITSHARD=${{ matrix.shard }} RACE= UNITTIMEOUT=4m COVERAGE=.build/coverage
      - if: steps.tests.outcome == 'success' && steps.prepare.outputs.cache-hit != 'true'
        uses: ./.github/actions/save
        with:
          key: go-v4-coverage-${{ runner.os }}-${{ strategy.job-index }}-${{ hashFiles('go.sum') }}
          save: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit-${{ strategy.job-index }}
          path: .build/coverage/go-unit-*.txt
          if-no-files-found: error
          include-hidden-files: true

  # The interface's own tests, counting the lines they run.
  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Interface tests counting their lines
        run: make interface COVERAGE=.build/coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-interface
          path: .build/coverage/interface-unit/lcov.info
          if-no-files-found: error
          include-hidden-files: true

  # The counts to Codecov, see .github/codecov.yml, signed in with
  # GitHub's own OIDC token, so no Codecov token is kept anywhere. Each
  # kind of test is uploaded with every file its shares left, whatever
  # their number. A kind whose run failed sends nothing that night, since
  # what it counted is only part of what it reaches, and Codecov carries
  # its last counts forward instead. One upload that fails does not keep
  # the others back.
  codecov:
    needs: [walks, unit, interface]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage
      - id: files
        run: |
          for kind in unit interface walks; do
            echo "$kind=$(ls coverage/coverage-$kind*/* | paste -sd, -)" >> "$GITHUB_OUTPUT"
          done
      - if: ${{ !cancelled() && needs.unit.result == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          disable_search: true
          fail_ci_if_error: true
          flags: go-tests
          files: ${{ steps.files.outputs.unit }}
      - if: ${{ !cancelled() && needs.interface.result == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          disable_search: true
          fail_ci_if_error: true
          flags: interface-tests
          files: ${{ steps.files.outputs.interface }}
      - if: ${{ !cancelled() && needs.walks.result == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          disable_search: true
          fail_ci_if_error: true
          flags: walks
          files: ${{ steps.files.outputs.walks }}
