# Every sequence walked with the app's motion, and the map of what each
# run goes through recorded, once a night on main, so a pull request does
# not wait for either. See Where they run in docs/TESTING.md.
#
# The walks in ci.yml walk a sequence asking for less motion unless one of
# its steps looks at how the app moves, the steps named in moving in
# frontend/preview/walks/sequences.mjs. A new step that looks at motion and
# is not named there passes without ever seeing what it checks. Walked with
# the motion it does see it, so a step left out of moving fails here.
#
# The map is what picks the walks of a pull request, see
# frontend/preview/walks/walkmap.mjs: each run walked the way ci.yml walks
# it, with the lines of Go and of the interface it ran written down, then
# made into one map and kept in the Actions cache, where ci.yml's first
# job finds the newest. A pull request compares what it changed with the
# commit the map was recorded on.
name: Nightly walks with motion

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yml

  # The same as the walks in ci.yml, with STILL=none.
  walks:
    needs: image
    name: walks
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash -e {0}
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --init --ipc=host
      volumes:
        - /home/runner/work:/home/runner/work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The checkout is the runner's user's and the job runs as root, see
      # the walks in ci.yml.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v2-walks-${{ runner.os }}-${{ github.sha }}
          restore-keys: go-v2-walks-${{ runner.os }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: ffmpeg
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: The ffmpeg we ship
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: sh scripts/build-ffmpeg.sh .build/ffmpeg
      - name: The episode's decoder
        run: make frames
      # The videos the walks in ci.yml kept for this share, only read.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/walk-videos
          key: walk-videos-${{ strategy.job-index }}-${{ needs.image.outputs.ref }}-${{ hashFiles('cmd/framefairy-app/walkvideos_test.go') }}-
          restore-keys: walk-videos-${{ strategy.job-index }}-${{ needs.image.outputs.ref }}-${{ hashFiles('cmd/framefairy-app/walkvideos_test.go') }}-
      - name: Sequences and walks with motion
        run: |
          make walks STILL=none WALKSHARD=${{ matrix.shard }} WALKTIMEOUT=12m 2>&1 | tee walks.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then sh scripts/test-failures.sh walks.log; fi
          exit "$status"

  # The walks as ci.yml walks them, recording what each run went through,
  # see WALKRECORD in the Makefile. A bridge for every run, built with
  # Go's coverage, and the counting in every page make each run slower
  # than in CI.
  record:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -e {0}
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --init --ipc=host
      volumes:
        - /home/runner/work:/home/runner/work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The checkout is the runner's user's and the job runs as root, see
      # the walks in ci.yml.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v2-walks-${{ runner.os }}-${{ github.sha }}
          restore-keys: go-v2-walks-${{ runner.os }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: ffmpeg
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: The ffmpeg we ship
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: sh scripts/build-ffmpeg.sh .build/ffmpeg
      - name: The episode's decoder
        run: make frames
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/walk-videos
          key: walk-videos-${{ strategy.job-index }}-${{ needs.image.outputs.ref }}-${{ hashFiles('cmd/framefairy-app/walkvideos_test.go') }}-
          restore-keys: walk-videos-${{ strategy.job-index }}-${{ needs.image.outputs.ref }}-${{ hashFiles('cmd/framefairy-app/walkvideos_test.go') }}-
      # A run that fails is recorded all the same: what it ran until then
      # is what it goes through, and the failure is the walks' to report,
      # not the map's. A run that records nothing fails the job, and with
      # it the map, so no map that knows less than it says is kept.
      - name: Sequences and walks, recorded
        run: make walks WALKRECORD="$PWD/.build/walk-record" WALKSHARD=${{ matrix.shard }} WALKTIMEOUT=25m
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walk-record-${{ strategy.job-index }}
          path: .build/walk-record
          retention-days: 1

  # The records of every machine made into the map and kept.
  map:
    needs: record
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: walk-record-*
          path: .build/walk-record
      - name: The map of the walks
        run: make walkmap WALKRECORD=.build/walk-record
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/walkmap.json
          key: walkmap-v1-${{ github.sha }}
