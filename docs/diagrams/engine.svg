<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 714" width="760" height="714" role="img" aria-label="The engine today: one package, over its small ones">
<style>
.t{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.n{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.p{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#59636e}
.q{font:11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#59636e}
.c{font:11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.bg{fill:#ffffff}
.box{fill:none;stroke:#b6bcc4;stroke-width:1.25}
.dash{fill:none;stroke:#b6bcc4;stroke-width:1.25;stroke-dasharray:4 4}
.tint{fill:#f1f3f5;stroke:#b6bcc4;stroke-width:1.25}
.chip{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1}
.ax{stroke:#8c959f;stroke-width:1.25;fill:none}
.ah{fill:#8c959f}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117}
.t,.n,.c{fill:#f0f6fc}.p,.q{fill:#9198a1}
.box,.dash{stroke:#5d6570}.tint{fill:#1c2128;stroke:#5d6570}
.chip{fill:#212830;stroke:#3d444d}.ax{stroke:#7d8590}.ah{fill:#7d8590}}
</style>
<rect class="bg" width="760" height="714" rx="12"/>
<text class="t" x="24" y="30">The engine today: one package, over its small ones</text>
<text class="q" x="24" y="50">may use</text>
<path class="ax" d="M40 60V684"/>
<path class="ah" d="M35 680L40 690L45 680z"/>
<rect class="box" x="64" y="56" width="672" height="218" rx="8"/>
<text class="n" x="76" y="78">engine</text>
<text class="p" x="76" y="96">engine/</text>
<text class="q" x="76" y="112">one package: any file may use any other, so its areas are not layers yet</text>
<rect class="chip" x="76" y="122" width="216" height="22" rx="6"/>
<text class="c" x="84" y="137">run: Run, Project, views, jobs</text>
<rect class="chip" x="298" y="122" width="223" height="22" rx="6"/>
<text class="c" x="306" y="137">search: plans, recipes, answers</text>
<rect class="chip" x="527" y="122" width="189" height="22" rx="6"/>
<text class="c" x="535" y="137">models: cloud, local, keys</text>
<rect class="chip" x="76" y="150" width="303" height="22" rx="6"/>
<text class="c" x="84" y="165">clips: the plan file, edits, undo, gestures</text>
<rect class="chip" x="385" y="150" width="249" height="22" rx="6"/>
<text class="c" x="393" y="165">captions: lines, the drawing, fonts</text>
<rect class="chip" x="76" y="178" width="229" height="22" rx="6"/>
<text class="c" x="84" y="193">framing: crops, faces, rotations</text>
<rect class="chip" x="311" y="178" width="56" height="22" rx="6"/>
<text class="c" x="319" y="193">render</text>
<rect class="chip" x="373" y="178" width="289" height="22" rx="6"/>
<text class="c" x="381" y="193">media: ffmpeg, probes, the decoder client</text>
<rect class="chip" x="76" y="206" width="269" height="22" rx="6"/>
<text class="c" x="84" y="221">speech: hearing, the transcript, words</text>
<rect class="chip" x="351" y="206" width="309" height="22" rx="6"/>
<text class="c" x="359" y="221">training: the records of answers and actions</text>
<rect class="chip" x="76" y="234" width="89" height="22" rx="6"/>
<text class="c" x="84" y="249">base: files</text>
<rect class="box" x="64" y="290" width="672" height="90" rx="8"/>
<text class="n" x="76" y="312">the log of a run</text>
<text class="p" x="76" y="330">engine/runlog/</text>
<rect class="chip" x="76" y="340" width="36" height="22" rx="6"/>
<text class="c" x="84" y="355">Log</text>
<rect class="chip" x="118" y="340" width="43" height="22" rx="6"/>
<text class="c" x="126" y="355">Step</text>
<rect class="chip" x="167" y="340" width="69" height="22" rx="6"/>
<text class="c" x="175" y="355">Progress</text>
<rect class="chip" x="242" y="340" width="49" height="22" rx="6"/>
<text class="c" x="250" y="355">Event</text>
<rect class="chip" x="297" y="340" width="43" height="22" rx="6"/>
<text class="c" x="305" y="355">Sink</text>
<rect class="chip" x="346" y="340" width="69" height="22" rx="6"/>
<text class="c" x="354" y="355">Underway</text>
<rect class="box" x="64" y="396" width="672" height="90" rx="8"/>
<text class="n" x="76" y="418">numbers, the same on every platform</text>
<text class="p" x="76" y="436">engine/num/</text>
<rect class="chip" x="76" y="446" width="49" height="22" rx="6"/>
<text class="c" x="84" y="461">Round</text>
<rect class="chip" x="131" y="446" width="63" height="22" rx="6"/>
<text class="c" x="139" y="461">RoundTo</text>
<rect class="chip" x="200" y="446" width="49" height="22" rx="6"/>
<text class="c" x="208" y="461">Fixed</text>
<rect class="chip" x="255" y="446" width="36" height="22" rx="6"/>
<text class="c" x="263" y="461">Sum</text>
<rect class="chip" x="297" y="446" width="49" height="22" rx="6"/>
<text class="c" x="305" y="461">Float</text>
<rect class="chip" x="353" y="446" width="56" height="22" rx="6"/>
<text class="c" x="361" y="461">Format</text>
<rect class="chip" x="415" y="446" width="49" height="22" rx="6"/>
<text class="c" x="423" y="461">Parse</text>
<rect class="chip" x="470" y="446" width="63" height="22" rx="6"/>
<text class="c" x="478" y="461">AsFloat</text>
<rect class="chip" x="539" y="446" width="49" height="22" rx="6"/>
<text class="c" x="547" y="461">AsInt</text>
<rect class="chip" x="594" y="446" width="76" height="22" rx="6"/>
<text class="c" x="602" y="461">Thousands</text>
<rect class="box" x="64" y="502" width="328" height="118" rx="8"/>
<text class="n" x="76" y="524">text, by its characters</text>
<text class="p" x="76" y="542">engine/runes/</text>
<rect class="chip" x="76" y="552" width="36" height="22" rx="6"/>
<text class="c" x="84" y="567">Len</text>
<rect class="chip" x="118" y="552" width="56" height="22" rx="6"/>
<text class="c" x="126" y="567">Prefix</text>
<rect class="chip" x="180" y="552" width="43" height="22" rx="6"/>
<text class="c" x="188" y="567">Trim</text>
<rect class="chip" x="229" y="552" width="56" height="22" rx="6"/>
<text class="c" x="237" y="567">Fields</text>
<rect class="chip" x="291" y="552" width="49" height="22" rx="6"/>
<text class="c" x="299" y="567">Scrub</text>
<rect class="chip" x="76" y="580" width="49" height="22" rx="6"/>
<text class="c" x="84" y="595">Quote</text>
<rect class="box" x="408" y="502" width="328" height="118" rx="8"/>
<text class="n" x="420" y="524">a moment of a video</text>
<text class="p" x="420" y="542">engine/timed/</text>
<rect class="chip" x="420" y="552" width="36" height="22" rx="6"/>
<text class="c" x="428" y="567">Cue</text>
<rect class="chip" x="462" y="552" width="43" height="22" rx="6"/>
<text class="c" x="470" y="567">Span</text>
<rect class="chip" x="511" y="552" width="56" height="22" rx="6"/>
<text class="c" x="519" y="567">Window</text>
<rect class="chip" x="573" y="552" width="63" height="22" rx="6"/>
<text class="c" x="581" y="567">Reading</text>
<rect class="chip" x="420" y="580" width="96" height="22" rx="6"/>
<text class="c" x="428" y="595">FrameSeconds</text>
<rect class="box" x="64" y="636" width="213" height="54" rx="8"/>
<text class="n" x="76" y="658">a licence key</text>
<text class="p" x="76" y="676">licence/</text>
<rect class="box" x="293" y="636" width="213" height="54" rx="8"/>
<text class="n" x="305" y="658">waiting on a change</text>
<text class="p" x="305" y="676">internal/wake/</text>
<rect class="box" x="523" y="636" width="213" height="54" rx="8"/>
<text class="n" x="535" y="658">the wire to the decoder</text>
<text class="p" x="535" y="676">internal/framewire/</text>
</svg>
