<text class="p" x="76" y="754">engine/runes/</text>
<rect class="chip" x="76" y="764" width="36" height="22" rx="6"/>
<text class="c" x="84" y="779">Len</text>
<rect class="chip" x="118" y="764" width="56" height="22" rx="6"/>
