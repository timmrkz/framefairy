<text class="c" x="537" y="121">flags</text>
<rect class="chip" x="585" y="106" width="83" height="22" rx="6"/>
<text class="c" x="593" y="121">exit codes</text>
<rect class="box" x="64" y="162" width="437" height="90" rx="8"/>
<text class="n" x="76" y="184">the app&#x27;s Go side</text>
<text class="p" x="76" y="202">cmd/framefairy-app/</text>
<rect class="chip" x="76" y="212" width="69" height="22" rx="6"/>
<text class="c" x="84" y="227">bindings</text>
<rect class="chip" x="151" y="212" width="76" height="22" rx="6"/>
