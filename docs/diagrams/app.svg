<rect class="chip" x="378" y="630" width="56" height="22" rx="6"/>
<text class="c" x="386" y="645">ffmpeg</text>
<rect class="chip" x="440" y="630" width="96" height="22" rx="6"/>
<text class="c" x="448" y="645">llama-server</text>
<rect class="chip" x="542" y="630" width="83" height="22" rx="6"/>
<text class="c" x="550" y="645">the models</text>
<rect class="chip" x="76" y="658" width="123" height="22" rx="6"/>
<text class="c" x="84" y="673">the work folders</text>
