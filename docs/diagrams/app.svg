<rect class="chip" x="145" y="106" width="83" height="22" rx="6"/>
<text class="c" x="153" y="121">components</text>
<rect class="chip" x="233" y="106" width="196" height="22" rx="6"/>
<text class="c" x="241" y="121">lib: stores, api.ts, frames</text>
