<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="The app&#x27;s Go side: one package main, over the engine">
<style>
.t{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.n{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.p{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#59636e}
.q{font:11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#59636e}
.c{font:11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.bg{fill:#ffffff}
.box{fill:none;stroke:#b6bcc4;stroke-width:1.25}
.dash{fill:none;stroke:#b6bcc4;stroke-width:1.25;stroke-dasharray:4 4}
.tint{fill:#f1f3f5;stroke:#b6bcc4;stroke-width:1.25}
.chip{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1}
.ax{stroke:#8c959f;stroke-width:1.25;fill:none}
.ah{fill:#8c959f}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117}
.t,.n,.c{fill:#f0f6fc}.p,.q{fill:#9198a1}
.box,.dash{stroke:#5d6570}.tint{fill:#1c2128;stroke:#5d6570}
.chip{fill:#212830;stroke:#3d444d}.ax{stroke:#7d8590}.ah{fill:#7d8590}}
</style>
<rect class="bg" width="760" height="560" rx="12"/>
<text class="t" x="24" y="30">The app&#x27;s Go side: one package main, over the engine</text>
<text class="q" x="24" y="50">may use</text>
<path class="ax" d="M40 60V530"/>
<path class="ah" d="M35 526L40 536L45 526z"/>
<rect class="box" x="64" y="56" width="672" height="218" rx="8"/>
<text class="n" x="76" y="78">the app&#x27;s Go side</text>
<text class="p" x="76" y="96">cmd/framefairy-app/</text>
<text class="q" x="76" y="112">package main: its groups are files, not packages</text>
<rect class="chip" x="76" y="122" width="430" height="22" rx="6"/>
<text class="c" x="84" y="137">the app: main, menu, chrome, refresh, sight, quit, drop, probe</text>
<rect class="chip" x="76" y="150" width="576" height="22" rx="6"/>
<text class="c" x="84" y="165">a video: views, edits, history, captions, frames, media, words, room, levels, export</text>
<rect class="chip" x="76" y="178" width="383" height="22" rx="6"/>
<text class="c" x="84" y="193">the queue: jobs, lanes, search, keep, the search window</text>
<rect class="chip" x="76" y="206" width="436" height="22" rx="6"/>
<text class="c" x="84" y="221">library and settings: library, settings, chosen, setup, licence</text>
<rect class="chip" x="518" y="206" width="183" height="22" rx="6"/>
<text class="c" x="526" y="221">updates: updates, install</text>
<rect class="chip" x="76" y="234" width="336" height="22" rx="6"/>
<text class="c" x="84" y="249">reports: applog, bugs, report, listen, recording</text>
<rect class="chip" x="418" y="234" width="229" height="22" rx="6"/>
<text class="c" x="426" y="249">training: what is done to a clip</text>
<rect class="box" x="64" y="290" width="213" height="54" rx="8"/>
<text class="n" x="76" y="312">speech recogniser</text>
<text class="p" x="76" y="330">asr/</text>
<rect class="box" x="293" y="290" width="213" height="54" rx="8"/>
<text class="n" x="305" y="312">newer builds</text>
<text class="p" x="305" y="330">updates/</text>
<rect class="box" x="523" y="290" width="213" height="54" rx="8"/>
<text class="n" x="535" y="312">licences of parts</text>
<text class="p" x="535" y="330">notices/</text>
<rect class="box" x="64" y="360" width="672" height="106" rx="8"/>
<text class="n" x="76" y="382">the engine</text>
<text class="p" x="76" y="400">engine/</text>
<text class="q" x="76" y="416">reached through engine.Project</text>
<rect class="chip" x="76" y="426" width="103" height="22" rx="6"/>
<text class="c" x="84" y="441">engine/runlog</text>
<rect class="chip" x="185" y="426" width="96" height="22" rx="6"/>
<text class="c" x="193" y="441">engine/timed</text>
<rect class="chip" x="287" y="426" width="96" height="22" rx="6"/>
<text class="c" x="295" y="441">engine/runes</text>
<rect class="chip" x="389" y="426" width="89" height="22" rx="6"/>
<text class="c" x="397" y="441">engine/tool</text>
<rect class="chip" x="484" y="426" width="103" height="22" rx="6"/>
<text class="c" x="492" y="441">engine/fileio</text>
<rect class="box" x="64" y="482" width="672" height="54" rx="8"/>
<text class="n" x="76" y="504">small libraries</text>
<text class="p" x="76" y="522">licence/, internal/wake/, internal/framewire/</text>
</svg>
