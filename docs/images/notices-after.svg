<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="Since #500: make reads which Go modules and npm packages the app is built from, reads each one's licence file, checks it against the committed list of allowed licences and writes the notices beside the app. Only a licence not on the list stops the build.">
  <style>
    text { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; fill: #1d1a20; }
    .t { font-size: 13px; font-weight: 600; }
    .s { font-size: 11px; fill: #625b68; }
    .m { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
    .lbl { font-size: 11px; fill: #625b68; font-style: italic; }
    .bg { fill: #f6f5f7; }
    .box { fill: #ffffff; stroke: #c9c3ce; stroke-width: 1.5; }
    .keep { fill: #f3e3f2; stroke: #942192; stroke-width: 2; }
    .stop { fill: #fbe4e2; stroke: #b3261e; stroke-width: 2; }
    .ar { stroke: #1d1a20; stroke-width: 1.5; fill: none; }
    .ar-stop { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .head { fill: #1d1a20; }
    .head-stop { fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      text { fill: #ebe7ee; }
      .s, .lbl { fill: #a49cab; }
      .bg { fill: #17151a; }
      .box { fill: #211e25; stroke: #4a4450; }
      .keep { fill: #3a1d3a; stroke: #d26ad0; }
      .stop { fill: #3d1d1b; stroke: #f08a80; }
      .ar { stroke: #ebe7ee; }
      .ar-stop { stroke: #f08a80; }
      .head { fill: #ebe7ee; }
      .head-stop { fill: #f08a80; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-stop" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <rect class="bg" width="760" height="560"/>
  <rect class="box" x="40" y="20" width="220" height="64" rx="6"/>
  <text class="m" x="150" y="48" text-anchor="middle">go.mod, go.sum</text>
  <text class="s" x="150" y="66" text-anchor="middle">Dependabot changes these</text>
  <rect class="box" x="300" y="20" width="220" height="64" rx="6"/>
  <text class="m" x="410" y="48" text-anchor="middle">package-lock.json</text>
  <text class="s" x="410" y="66" text-anchor="middle">Dependabot changes this</text>
  <rect class="box" x="40" y="130" width="220" height="64" rx="6"/>
  <text class="t" x="150" y="157" text-anchor="middle">go list</text>
  <text class="s" x="150" y="175" text-anchor="middle">modules the programs compile</text>
  <rect class="box" x="300" y="130" width="220" height="64" rx="6"/>
  <text class="t" x="410" y="157" text-anchor="middle">Interface build</text>
  <text class="s" x="410" y="175" text-anchor="middle">packages it bundled</text>
  <rect class="keep" x="560" y="130" width="190" height="64" rx="6"/>
  <text class="t" x="655" y="157" text-anchor="middle">Allowed licences</text>
  <text class="s" x="655" y="175" text-anchor="middle">MIT, BSD, Apache and more</text>
  <line class="ar" x1="150" y1="84" x2="150" y2="128" marker-end="url(#a)"/>
  <line class="ar" x1="410" y1="84" x2="410" y2="128" marker-end="url(#a)"/>
  <text class="lbl" x="560" y="108">the one thing committed,</text>
  <text class="lbl" x="560" y="122">changed only by a person</text>
  <rect class="box" x="40" y="250" width="710" height="64" rx="6"/>
  <text class="t" x="395" y="277" text-anchor="middle">make reads each licence file and checks it</text>
  <text class="s" x="395" y="295" text-anchor="middle">from the exact folder the build used, at the exact version</text>
  <line class="ar" x1="150" y1="194" x2="150" y2="248" marker-end="url(#a)"/>
  <line class="ar" x1="410" y1="194" x2="410" y2="248" marker-end="url(#a)"/>
  <line class="ar" x1="655" y1="194" x2="655" y2="248" marker-end="url(#a)"/>
  <rect class="box" x="40" y="370" width="200" height="64" rx="6"/>
  <text class="m" x="140" y="397" text-anchor="middle">licences.json</text>
  <text class="s" x="140" y="415" text-anchor="middle">beside the app, never committed</text>
  <rect class="box" x="290" y="370" width="210" height="64" rx="6"/>
  <text class="t" x="395" y="397" text-anchor="middle">Acknowledgements</text>
  <text class="s" x="395" y="415" text-anchor="middle">in the app's Help menu</text>
  <rect class="stop" x="560" y="370" width="190" height="64" rx="6"/>
  <text class="t" x="655" y="397" text-anchor="middle">Build stops</text>
  <text class="s" x="655" y="415" text-anchor="middle">a person reads that licence</text>
  <line class="ar" x1="140" y1="314" x2="140" y2="368" marker-end="url(#a)"/>
  <text class="lbl" x="148" y="345">all allowed</text>
  <line class="ar-stop" x1="655" y1="314" x2="655" y2="368" marker-end="url(#as)"/>
  <text class="lbl" x="663" y="345">one is not</text>
  <line class="ar" x1="240" y1="402" x2="288" y2="402" marker-end="url(#a)"/>
  <rect class="box" x="290" y="480" width="210" height="64" rx="6"/>
  <text class="m" x="395" y="507" text-anchor="middle">notices/</text>
  <text class="s" x="395" y="525" text-anchor="middle">ffmpeg, llama, fonts, models</text>
  <line class="ar" x1="395" y1="480" x2="395" y2="436" marker-end="url(#a)"/>
  <text class="lbl" x="510" y="500">pinned by hand,</text>
  <text class="lbl" x="510" y="514">written by make notices</text>
</svg>
