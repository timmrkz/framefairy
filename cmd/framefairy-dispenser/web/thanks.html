<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank you</title><link rel="stylesheet" href="/web/style.css"></head>
<body class="buyer"><main>
<section>
<h1>Thank you</h1>
<div id="state"><p class="dim">Your key is on its way…</p></div>
</section>
<p class="dim"><a href="/lost">Lost your key?</a> · <a href="/dev">Dev page</a></p>
</main>
<script>
// The link that opens Frame Fairy on this Mac and unlocks it with the key,
// with nothing more to press.
function unlockLink(k) {
  return "framefairy://unlock?key=" + encodeURIComponent(k);
}

// The thank-you page asks the dispenser for the keys of the sale Paddle's
// checkout named, every two seconds until they are there. It sends the
// nonce the checkout page kept in this tab, in the body, so it is in no
// link and no log. Without it, in another browser or another tab, the
// keys come by email only.
const ref = new URLSearchParams(location.search).get("txn") || "";
let nonce = "";
try { nonce = sessionStorage.getItem("thanks") || ""; } catch (e) {}
const state = document.getElementById("state");
function say(html) { state.innerHTML = html; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
async function ask() {
  if (!nonce) {
    say('<p>Your key comes by email. This page shows it only in the tab you paid in, and the <a href="/lost">lost-key page</a> sends it again.</p>');
    return;
  }
  let res;
  try {
    res = await fetch("/v1/thanks/" + encodeURIComponent(ref), {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({nonce: nonce}),
    });
  } catch (e) {
    say('<p class="bad">The dispenser does not answer. Your key also comes by email.</p>');
    return setTimeout(ask, 4000);
  }
  const body = await res.json().catch(() => ({}));
  // What a buyer needs is the button. The key ID names the key, the way
  // the app's settings and support do. The key itself is long and means
  // nothing to a person, so it waits behind a fold, for a password
  // manager or for pasting by hand.
  if (res.status === 200) {
    const keys = body.keys || [];
    const ids = body.ids || [];
    const one = keys.length === 1;
    const seat = (k, i) => '<div class="seat">' +
      (one ? "" : '<p class="dim small">Seat ' + (i + 1) + '</p>') +
      '<a class="unlock big" href="' + esc(unlockLink(k)) + '">Unlock Frame Fairy</a>' +
      '<p class="key-id"><span class="dim">Key ID</span> ' + esc(ids[i] || "") + '</p></div>';
    say('<p>' + (one ? "Frame Fairy is yours. Unlock opens it on this Mac and unlocks it, with nothing else to do."
        : "Frame Fairy is yours, on " + keys.length + " Macs. On each Mac, Unlock opens it and unlocks it with that seat's key.") + '</p>' +
      keys.map(seat).join("") +
      '<p class="dim small">The settings in Frame Fairy show the same key ID. ' + (one ? "The key also comes" : "The keys also come") + ' by email.</p>' +
      '<details class="small"><summary class="dim">' + (one ? "The licence key itself" : "The licence keys themselves") + '</summary>' +
      '<p class="dim">For your password manager, or to paste into the settings by hand.</p>' +
      keys.map((k, i) => (one ? "" : '<p class="dim">Key ID ' + esc(ids[i] || "") + '</p>') + '<div class="key mono">' + esc(k) + '</div>').join("") +
      '</details>');
    return;
  }
  if (res.status === 202) {
    say('<p class="dim">Your key is on its way…</p>');
    return setTimeout(ask, 2000);
  }
  if (res.status === 410) {
    say('<p>This sale is more than an hour old, so its keys are no longer shown here. They went to your email address, and the <a href="/lost">lost-key page</a> sends them again.</p>');
    return;
  }
  if (res.status === 503) {
    say('<p class="warn">Your key is taking longer than usual. It comes by email as soon as it is ready. (' + esc(body.error || res.status) + ')</p>');
    return setTimeout(ask, 5000);
  }
  say('<p class="bad">Something went wrong: ' + esc(body.error || res.status) + '. Your key also comes by email.</p>');
}
ask();
</script>
</body></html>
